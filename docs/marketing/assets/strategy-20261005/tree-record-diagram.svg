<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440"><rect width="640" height="440" rx="24" fill="#fff9f3"/><g font-family="sans-serif" fill="#3f2f24"><text x="40" y="58" font-size="22" font-weight="bold">나무 · 놀이와 기록의 연결</text><text x="40" y="90" font-size="16">설명 도해 · 실제 아이의 기록 아님</text><rect x="32" y="114" width="576" height="74" rx="14" fill="#ffe4dc"/><text x="52" y="145" font-size="20">이야기에서 만남</text><text x="52" y="173" font-size="16">책 장면과 낱말을 보고 들은 경험</text><rect x="32" y="202" width="576" height="74" rx="14" fill="#e3f4ec"/><text x="52" y="233" font-size="20">놀이에서 직접 해봄</text><text x="52" y="261" font-size="16">낱말 맞추기와 색칠 참여를 구분</text><rect x="32" y="290" width="576" height="74" rx="14" fill="#fff0e0"/><text x="52" y="321" font-size="20">다음에 무엇을 해볼까?</text><text x="52" y="349" font-size="16">활동 근거와 관심사로 다음 놀이 제안</text><text x="40" y="407" font-size="16">만남·참여 기록 ≠ 읽기 습득 판정</text></g></svg>