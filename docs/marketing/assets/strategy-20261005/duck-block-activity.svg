<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><rect width="800" height="560" fill="#f4f1e6"/><g font-family="Malgun Gothic,sans-serif" fill="#193c34"><text x="40" y="54" font-size="26" font-weight="bold">블록 맞춰보기 · ‘오리’</text><rect x="40" y="80" width="720" height="365" rx="24" fill="white"/><text x="80" y="137" font-size="24">오</text><text x="425" y="137" font-size="24">리</text><path d="M390 100V420" stroke="#ddd" stroke-width="2"/><circle cx="205" cy="232" r="54" stroke="#db7152" stroke-width="23" fill="none"/><path d="M205 318V352M151 352H259" stroke="#e9b345" stroke-width="23" stroke-linecap="round"/><path d="M465 198H555V249H465V302H555" stroke="#508c76" stroke-width="23" stroke-linejoin="round" stroke-linecap="round" fill="none"/><path d="M642 192V312" stroke="#e9b345" stroke-width="23" stroke-linecap="round"/><text x="132" y="408" font-size="23">ㅇ + ㅗ → 오</text><text x="468" y="408" font-size="23">ㄹ + ㅣ → 리</text><text x="40" y="496" font-size="22">같은 낱말을 자모 모양으로 조합합니다.</text><text x="40" y="535" font-size="16" fill="#63716a">활동 설명 도해 · 실제 앱 화면이나 제품 사진 아님</text></g></svg>