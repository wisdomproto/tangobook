<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><title>아시아·태평양 보육서비스 시장 성장 전망</title><desc>2024년 추정 1230억 달러와 2030년 전망 1629억 달러를 0 기준 막대로 비교. 2025~2030년 연평균 성장률 전망 4.8%.</desc><text x="50" y="55" font-family="Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#173e36" text-anchor="start">아시아·태평양 보육서비스 시장</text><text x="50" y="95" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="400" fill="#435c51" text-anchor="start">민간 시장 추정·전망 · 단위: 억 달러</text><rect x="570" y="76" width="280" height="65" rx="8" fill="#edf4e8"/><text x="710" y="104" font-family="Malgun Gothic,sans-serif" font-size="15" font-weight="400" fill="#173e36" text-anchor="middle">2025–2030년 연평균</text><text x="710" y="129" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="700" fill="#173e36" text-anchor="middle">4.8% 성장 전망</text><path d="M115 500.0H810" stroke="#d9e4d5" stroke-width="1"/><text x="98" y="506.0" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#435c51" text-anchor="end">0</text><path d="M115 380.0H810" stroke="#d9e4d5" stroke-width="1"/><text x="98" y="386.0" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#435c51" text-anchor="end">600</text><path d="M115 260.0H810" stroke="#d9e4d5" stroke-width="1"/><text x="98" y="266.0" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#435c51" text-anchor="end">1,200</text><path d="M115 140.0H810" stroke="#d9e4d5" stroke-width="1"/><text x="98" y="146.0" font-family="Malgun Gothic,sans-serif" font-size="16" font-weight="400" fill="#435c51" text-anchor="end">1,800</text><rect x="235" y="254.0" width="170" height="246.0" rx="8" fill="#3c755d"/><text x="320" y="306.0" font-family="Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">1,230억</text><text x="320" y="539" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#1