<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#db7152"/></marker></defs><rect width="1100" height="900" rx="28" fill="#f4f1e6"/><g font-family="Malgun Gothic,sans-serif" fill="#193c34"><text x="40" y="54" font-size="29" font-weight="bold">탱고북 · 배움과 놀이가 이어지는 플랫폼</text><text x="40" y="91" font-size="20">무료 콘텐츠로 시작 → 아이가 스스로 선택 → 부모가 배움 확인 → 다음 놀이</text><g stroke="#db7152" stroke-width="4" fill="none" marker-end="url(#end)"><path d="M315 235H410"/><path d="M786 235H690"/><path d="M315 455H410"/><path d="M690 455H786"/><path d="M550 325V387"/></g><rect x="410" y="164" width="280" height="164" rx="28" fill="#193c34"/><text x="489" y="218" font-size="36" fill="white" font-weight="bold">탱고북</text><text x="451" y="260" font-size="22" fill="white">어휘로 콘텐츠를 연결</text><text x="445" y="294" font-size="16" fill="#f4f1e6">아이의 관심과 선택이 중심</text><rect x="35" y="133" width="280" height="205" rx="22" fill="white"/><text x="58" y="171" font-size="25" font-weight="bold">다국어 파닉스</text><text x="58" y="211" font-size="17">동남아 언어 · 몽골어로 확장</text><text x="58" y="249" font-size="20">자국어 · 영어 · 추가 언어</text><text x="58" y="289" font-size="16">듣기 · 조합 · 쓰기 · 놀이</text><rect x="785" y="133" width="280" height="205" rx="22" fill="white"/><text x="810" y="171" font-size="25" font-weight="bold">풍성한 동화책</text><text x="810" y="211" font-size="17">읽고 싶은 이야기를 고릅니다</text><text x="810" y="249" font-size="20">명작 · 전래 · 자연 · 창작</text><text x="810" y="289" font-size="16">그림 · 문장 · 나레이션 · 어휘</text><rect x="35" y="369" width="280" height="185" rx="22" fill="#ffe4dc"/><text x="58" y="410" font-size="25" font-weight="bold">독후활동</text><text x="58" y="451" font-size="17">만들고 표현하며 다시 즐깁니다</text><text x="58" y="491" font-size="20">블록 · 쓰기 · 색칠 · 그림 짝</text><text x="58" y="530" font-size="16">같은 낱말을 다른 놀이로</text><rect x="410" y="387" width="280" height="151" rx="22" fill="white"/><text x="439" y="430" font-size="24" font-weight="bold">아이의 자기주도 학습</text><text x="438" y="472" font-size="17">스스로 시작 · 선택 · 지속</text><text x="438" y="509" font-size="14">관심·학습 기록에 맞는 다음 놀이</text><rect x="785" y="369" width="280" height="185" rx="22" fill="#e1f1e8"/><text x="810" y="410" font-size="25" font-weight="bold">부모 학습 리포트</text><text x="810" y="451" font-size="17">놀이 안의 배움을 확인합니다</text><text x="810" y="491" font-size="20">요약 · 어휘별 근거 · 다음 놀이</text><text x="810" y="530" font-size="16">같은 아이 · 언어 · 낱말의 기록</text><path d="M287 612V583H177V554" stroke="#508c76" stroke-width="4" fill="none" marker-end="url(#end)"/><path d="M1045 612H1081V235H1065" stroke="#508c76" stroke-width="4" fill="none" marker-end="url(#end)"/><rect x="35" y="612" width="505" height="94" rx="16" fill="white"/><text x="56" y="648" font-size="20">아날로그 확장 · 탱고 블록 · 탱고 노트 · 인쇄</text><rect x="561" y="612" width="504" height="94" rx="16" fill="white"/><text x="581" y="648" font-size="20">아시아로 확장 · 시작은 한국에서</text><text x="41" y="884" font-size="15" fill="#63716a">플랫폼 전략 모식도 · 동남아·몽골 언어별 파닉스와 아날로그 연계 방향 포함</text><text x="56" y="682" font-size="17">같은 낱말: 화면 ↔ 손으로 하는 놀이</text><text x="581" y="682" font-size="17">자국어 · 영어 · 한국어 · 중국어 등</text><rect x="35" y="739" width="1030" height="111" rx="20" fill="#193c34"/><text x="58" y="778" font-size="25" fill="white" font-weight="bold">AI 개발·제작 효율 + 사람의 편집·검수</text><text x="58" y="813" font-size="19" fill="white">양의 확장: 새 책·시리즈·소재·언어  /  깊이의 확장: 어휘·활동·읽기 가이드</text><path d="M550 739V710" fill="none" stroke="#db7152" stroke-width="4" marker-end="url(#end)"/></g></svg>