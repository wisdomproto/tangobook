<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 리포트 · 화면 폭별 검수</title><style>*{box-sizing:border-box}body{font-family:"Malgun Gothic",sans-serif;margin:0;background:#eae5df;color:#382e26}header{padding:18px 22px;background:white;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:19px;margin:0}p{margin:6px 0 0;font-size:14px;color:#66584e}.controls{display:flex;gap:7px;flex-wrap:wrap}button{background:#fff8f2;border:1px solid #d8cabe;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit;font-size:14px;min-height:44px}button[aria-pressed=true]{background:#3c3027;color:white}button:focus-visible{outline:3px solid #bb422d;outline-offset:3px}.stage{overflow-x:auto;padding:24px 18px;display:flex;justify-content:flex-start}.frame-wrap{margin:auto;flex-shrink:0}iframe{display:block;width:390px;height:820px;border:0;border-radius:20px;box-shadow:0 10px 50px #49301c22;background:#fff9f3}.caption{text-align:center;margin:12px 0 5px;font-size:14px}a{color:#493426}</style></head><body><header><div><h1>부모 학습 리포트 · 모바일 우선 시안</h1><p>예시 데이터 · 검색·어휘 상세·언어·아이·기간·오류 상태를 눌러볼 수 있어요.</p></div><div class="controls" aria-label="미리보기 화면 폭"><button data-width="320" aria-pressed="false">320</button><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="true">390</button><button data-width="430" aria-pressed="false">430</button><button data-width="768" aria-pressed="false">태블릿</button><button data-width="1280" aria-pressed="false">PC</button><button id="detail-preview">어휘 상세</button></div></header><div class="stage"><div class="frame-wrap"><iframe id="preview" title="부모 학습 리포트 미리보기" src="learning-report-prototype-2026-10-05.html"></iframe><div class="caption" id="caption">390px · 모바일 화면</div><div class="caption"><a href="learning-report-prototype-2026-10-05.html">시안 전체 화면으로 보기</a></div></div></div><script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{const w=Number(b.dataset.width);document.getElementById('preview').style.width=w+'px';document.getElementById('caption').textContent=w+'px · '+(w<768?'모바일 화면':w<1080?'태블릿 화면':'PC 화면');document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.getElementById('detail-preview').onclick=()=>document.getElementById('preview').contentWindow.postMessage({kind:'open-word-preview'},location.origin);window.addEventListener('message',e=>{if(e.source!==document.getElementById('preview').contentWindow||e.origin!==location.origin||e.data?.kind!=='report-layout')return;document.getElementById('caption').textContent=e.data.width+'px 콘텐츠 · '+e.data.columns+'열 · '+(e.data.scrollWidth>e.data.width?'가로 넘침 있음':'가로 넘침 없음');});</script></body></html>
