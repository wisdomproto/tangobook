  const root=document.getElementById('tb-story-journey');
  const main=root.querySelector('.tb-main');
  const defaults={screen:'home',lang:'ko',selected:0,mode:'guided',freeTab:'learn',writing:true,journey:{ko:0,en:0},progress:{ko:[],en:[]},unlocked:{},scores:{}};
  let state=defaults;
  function restore(saved){if(!saved?.privateContent||saved.privateContent.version!==2)return;const p=saved.privateContent;state={...defaults,...p,journey:{ko:p.journey?.ko===1?1:0,en:p.journey?.en===1?1:0},progress:{ko:p.progress?.ko||[],en:p.progress?.en||[]},unlocked:p.unlocked||{},scores:p.scores||{}};if(!['home','map','activity','free','finish','parent'].includes(state.screen))state.screen='home';if(!['ko','en'].includes(state.lang))state.lang='ko';}
  restore(window.openai?.widgetState);
  let taps=0,drew=false,quizRound=0,firstAnswers=[],answered=false,feedback='',correctCount=0;
  const icon=(name)=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const pathKey=()=>state.lang+'-'+state.journey[state.lang];
  const glyphs=()=>({ko:[['ㅏ','ㅑ'],['ㅓ','ㅕ']],en:[['A','B'],['C','D']]}[state.lang][state.journey[state.lang]]);
  const title=()=>state.lang==='ko'?'모음 정원':'알파벳 정원';
  const nextGlyphs=()=>state.journey[state.lang]===0?(state.lang==='ko'?'ㅓ · ㅕ':'C · D'):'다음 글자 친구들';
  function plan(){const g=glyphs();return [{id:'listen-a',type:'listen',glyph:g[0],name:g[0]+' 만나기'},{id:'write-a',type:'write',glyph:g[0],name:g[0]+' 써보기'},{id:'listen-b',type:'listen',glyph:g[1],name:g[1]+' 만나기'},{id:'write-b',type:'write',glyph:g[1],name:g[1]+' 써보기'},{id:'game',type:'game',glyph:g.join(' · '),name:'소리 찾기'}].filter(s=>state.writing||s.type!=='write');}
  const done=(id)=>state.progress[state.lang].includes(state.journey[state.lang]+':'+id);
  const stageDone=(s)=>done(s.id)&&(s.type!=='game'||state.unlocked[pathKey()]);
  const current=()=>{const p=plan(),i=p.findIndex(s=>!done(s.id));return i>=0?i:p.length-1;};
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'이야기 마을',screen:state.screen,language:state.lang,mode:state.mode,journey:state.journey,writing:state.writing,unlocked:state.unlocked,firstAnswerScores:state.scores},privateContent:{...state,version:2}}).catch(()=>{});}
  function announce(text){root.querySelector('.tb-announcer').textContent=text;}
  function toy(g,small){return '<span class="tb-toy '+(small?'tb-small':'')+'" aria-hidden="true">'+(toyAssets[g]?'<img src="'+toyAssets[g]+'" alt="">':g+'<span class="tb-eyes"></span><span class="tb-cheek"></span>')+'</span>';}
  function resetLocal(){taps=0;drew=false;quizRound=0;firstAnswers=[];answered=false;feedback='';correctCount=0;}
  function openActivity(index,mode){state.selected=Math.min(Math.max(index,0),plan().length-1);state.mode=mode;state.screen='activity';resetLocal();render();save();}
  function scene(){return '<div class="tb-scene" aria-hidden="true"><span class="tb-sun"></span><span class="tb-tree"></span>'+toy(glyphs()[0],false)+toy(glyphs()[1],true)+'</div>';}
  function action(name,label,cls){return '<button data-action="'+name+'" class="'+(cls||'tb-primary')+' cursor-interaction">'+label+'</button>';}
  function pathChooser(freeMode){return '<div class="tb-free-tabs" aria-label="산책 선택">'+({ko:[['ㅏ','ㅑ'],['ㅓ','ㅕ']],en:[['A','B'],['C','D']]}[state.lang]).map((g,i)=>'<button data-action="choose-path" data-index="'+i+'" aria-pressed="'+(i===state.journey[state.lang])+'" class="cursor-interaction" '+(!freeMode&&i===1&&!state.unlocked[state.lang+'-0']?'disabled':'')+'>'+g.join(' · ')+(i===1&&!freeMode&&!state.unlocked[state.lang+'-0']?' '+icon('lock-keyhole'):'')+'</button>').join('')+'</div>';}
  function home(){const lang=state.lang==='ko'?'한글':'영어';return '<div class="tb-entry-heading"><div class="tb-kicker">학습 홈 / '+lang+'</div><h1>'+lang+', 어떻게 배울까요?</h1><p>길 따라 배우거나, 원하는 활동을 골라요.</p></div><div class="tb-entry-grid"><section class="tb-entry">'+scene()+'<span class="tb-pill">커리큘럼 모드</span><h2 style="margin-top:12px">길 따라 배우기</h2><p>한 번에 하나씩 만나고<br>놀이로 배운 소리를 확인해요.</p>'+action('continue',(state.progress[state.lang].length?'이어서 학습하기':'학습 시작하기')+icon('arrow-right'))+'</section><section class="tb-entry free">'+scene()+'<span class="tb-pill">자유모드</span><h2 style="margin-top:12px">골라서 놀기</h2><p>원하는 글자와 놀이를 고르고<br>좋아하는 활동을 다시 해요.</p>'+action('free','활동 고르기 '+icon('arrow-right'))+'</section></div>';}
  function map(){const p=plan(),ci=state.unlocked[pathKey()]?p.length:current();return '<div class="tb-heading"><div><div class="tb-kicker">한 걸음씩 따라가기</div><h1>'+title()+'</h1></div>'+action('continue','이어서 학습하기 '+icon('play'),'tb-secondary')+'</div>'+pathChooser(false)+'<section class="tb-map"><div class="tb-map-top"><span class="tb-pill">'+(state.journey[state.lang]===0?'첫 번째 산책':'두 번째 산책')+'</span><span>글자를 만나고, 써보고, 소리로 놀아요</span></div><div class="tb-road" style="--tb-stops:'+p.length+'">'+p.map((s,i)=>'<div class="tb-stop '+(stageDone(s)?'done':i===ci?'current':'')+'"><button data-action="stage" data-index="'+i+'" class="cursor-interaction" aria-label="'+s.name+' '+(stageDone(s)?'완료':i===ci?'지금 할 활동':'아직 열리지 않음')+'" '+(!stageDone(s)&&i>ci?'disabled':'')+'>'+(s.type==='game'?icon('ear'):s.type==='listen'&&toyAssets[s.glyph]?'<img class="tb-mini-art" src="'+toyAssets[s.glyph]+'" alt="">':s.glyph)+icon(stageDone(s)?'check':i===ci?'play':'lock-keyhole')+'</button><span class="tb-stop-label">'+s.name+'</span><span class="tb-stop-state">'+(stageDone(s)?'다시 만나기':i===ci?'지금 여기':'다음에 만나요')+'</span></div>').join('')+'</div><div class="tb-destination"><div><h3>다음 산책 · '+nextGlyphs()+'</h3><p>'+(state.unlocked[pathKey()]?'다음 글자 친구에게 가는 길이 열렸어요.':'소리 놀이로 배운 내용을 확인하면 다음 길이 열려요.')+'</p></div>'+(state.unlocked[pathKey()]&&state.journey[state.lang]===0?action('next-path','다음 산책 '+icon('arrow-right'),'tb-secondary'):icon(state.unlocked[pathKey()]?'lock-keyhole-open':'lock-keyhole'))+'</div></section><div class="tb-note">지난 활동은 언제든 다시 만날 수 있어요.</div>';}
  function activity(){const p=plan(),s=p[state.selected]||p[0],progress='<div class="tb-progress" aria-label="'+(state.selected+1)+' / '+p.length+' 활동">'+p.map((x,i)=>'<span class="'+(done(x.id)?'done':i===state.selected?'current':'')+'"></span>').join('')+'</div>';let body='',footer='';
    if(s.type==='listen'){body='<h2>'+s.glyph+' 친구를 만나봐요</h2><p class="tb-instruction">친구를 눌러 소리를 들어봐요</p><div class="tb-listen-friends">'+[0,1,2].map(i=>'<button data-action="listen" class="tb-glyph-button cursor-interaction" data-current="'+(i===taps)+'" aria-label="'+s.glyph+' 소리 듣기 '+(i+1)+'" '+(i!==taps?'disabled':'')+'>'+toy(s.glyph,false)+'</button>').join('')+'</div><div class="tb-listen-pips" aria-label="'+taps+'번 들었어요">'+[0,1,2].map(i=>'<span class="'+(taps>i?'done':'')+'">'+(taps>i?'✓':i+1)+'</span>').join('')+'</div>';footer=taps>=3?action('advance','다음으로 '+icon('arrow-right')):'<span class="tb-hint">세 번 만나면 다음으로 갈 수 있어요</span>';}
    if(s.type==='write'){body='<h2>'+s.glyph+'를 따라 써봐요</h2><p class="tb-instruction">종이 칸 위에 손가락으로 그려봐요</p><div class="tb-sheet" aria-label="'+s.glyph+' 따라 그리기">'+s.glyph+'<canvas width="380" height="400" aria-label="그리는 영역"></canvas></div><span class="tb-sheet-label">'+(drew?'잘 그렸어요. 다음 친구를 만나볼까요?':'천천히 글자 모양을 따라가요')+'</span>';footer=drew?action('advance','다음으로 '+icon('arrow-right')):'<span class="tb-hint">그림을 따라 그려보세요</span>';}
    if(s.type==='game'){const finished=quizRound>=3,target=[0,1,0][Math.min(quizRound,2)],prompt=state.lang==='ko'?({'ㅏ':'아','ㅑ':'야','ㅓ':'어','ㅕ':'여'}[glyphs()[target]]):glyphs()[target];body='<span class="tb-pill">소리 찾기 · '+Math.min(quizRound+1,3)+' / 3</span><h2 style="margin-top:14px">어떤 친구의 소리일까요?</h2><button data-action="audio" class="tb-audio cursor-interaction">'+icon('volume-2')+' 소리 듣기</button><div class="tb-choices">'+glyphs().map((g,i)=>'<button data-action="answer" data-index="'+i+'" class="tb-choice cursor-interaction" '+(finished||answered?'disabled':'')+' aria-label="'+g+' 고르기">'+(toyAssets[g]?'<img src="'+toyAssets[g]+'" alt="">':g)+'</button>').join('')+'</div><div class="tb-feedback" aria-live="polite">'+(finished?'친구들을 모두 만났어요':feedback||'')+'</div>';footer=finished?action('game-finish','산책 마치기 '+icon('arrow-right')):answered?action('next-question','다음 소리 '+icon('arrow-right')):'<span class="tb-hint">듣고, 친구를 골라주세요</span>';}
    return '<div class="tb-activity-head">'+action(state.mode==='free'?'free':'map',icon('arrow-left')+' '+(state.mode==='free'?'골라하기':'산책 지도'),'tb-secondary')+progress+'<span class="tb-pill">'+(state.mode==='free'?'자유롭게':'따라가기')+'</span></div><section class="tb-playfield">'+body+'</section><div class="tb-footer">'+footer+'</div>';}
  function free(){const g=glyphs(),p=plan(),learned=[done('listen-a'),done('listen-b')],gameReady=learned.every(Boolean);let tiles='';
    if(state.freeTab==='learn')tiles=p.filter(s=>s.type!=='game').map(s=>{const index=p.findIndex(x=>x.id===s.id);return '<button data-action="free-stage" data-index="'+index+'" class="tb-free-tile cursor-interaction"><div class="tb-free-art">'+(s.type==='listen'&&toyAssets[s.glyph]?'<img src="'+toyAssets[s.glyph]+'" alt="">':s.glyph)+(s.type==='write'?icon('pencil'):'')+'</div><h3>'+s.name+'</h3><p>'+icon(s.type==='write'?'pencil':'volume-2')+' '+(s.type==='write'?'글자 모양을 따라 써요':'눌러서 소리를 들어요')+(done(s.id)?' · 다시 해요':'')+'</p></button>';}).join('');
    if(state.freeTab==='play')tiles='<button data-action="free-stage" data-index="'+(p.length-1)+'" class="tb-free-tile cursor-interaction" '+(!gameReady?'disabled':'')+'><div class="tb-free-art">'+g.join(' ')+'</div><h3>소리 찾기</h3><p>'+icon('ear')+' '+(gameReady?'소리를 듣고 글자를 골라요':'두 친구를 먼저 만나면 열려요')+'</p></button><div class="tb-free-tile"><div class="tb-free-art">'+icon('book-open')+'</div><h3>놀이가 더 있어요</h3><p>짝 찾기 · 글자 찾기</p></div>';
    return '<div class="tb-heading"><div><div class="tb-kicker">자유롭게 골라하기</div><h1>어떤 친구와 놀까요?</h1></div><span class="tb-pill">'+title()+'</span></div>'+pathChooser(true)+'<div class="tb-free-tabs" aria-label="활동 종류"><button data-action="free-tab" data-value="learn" aria-pressed="'+(state.freeTab==='learn')+'" class="cursor-interaction">'+icon('sprout')+' 익히기</button><button data-action="free-tab" data-value="play" aria-pressed="'+(state.freeTab==='play')+'" class="cursor-interaction">'+icon('puzzle')+' 놀이</button></div><div class="tb-free-grid">'+tiles+'</div><div class="tb-note">여기서 만난 친구도 산책 기록에 함께 남아요.</div>';}
  function finish(){const score=state.scores[pathKey()]??null,ready=state.unlocked[pathKey()];return '<section class="tb-finish"><div class="tb-finish-art" aria-hidden="true">'+toy(glyphs()[0],false)+toy(glyphs()[1],true)+'</div><div class="tb-kicker">'+(state.journey[state.lang]===0?'첫 번째 산책':'두 번째 산책')+'</div><h1>'+(ready?(state.journey[state.lang]===0?'다음 길이 열렸어요!':'오늘의 산책을 마쳤어요!'):'친구를 한 번 더 만나봐요')+'</h1><p>'+(ready?'배운 소리로 다음 글자 친구를 만나러 가요.':'헷갈린 소리를 다시 듣고 놀아봐요.')+'</p><div class="tb-new-path">'+icon(ready?'lock-keyhole-open':'ear')+' '+(ready?'다음 산책 · '+nextGlyphs():'소리 찾기를 다시 해요')+'</div><div class="tb-action-row">'+action(ready?(state.journey[state.lang]===0?'next-path':'free'):'retry-game',ready?(state.journey[state.lang]===0?'다음 산책 시작 '+icon('arrow-right'):'자유롭게 더 놀기 '+icon('arrow-right')):'한 번 더 놀기 '+icon('rotate-ccw'))+action('home','오늘은 여기까지','tb-secondary')+'</div><small style="margin-top:25px">'+(score===null?'': '처음 고른 답 '+score+' / 3 · 부모님 기록에 남아요')+'</small></section>';}
  function parent(){return '<div class="tb-heading"><div><div class="tb-kicker">부모님과 함께 준비해요</div><h1>우리 아이의 산책</h1></div>'+action('home','마을로 돌아가기','tb-secondary')+'</div><section class="tb-parent-panel"><div class="tb-parent-row"><div><strong>'+title()+' · '+(state.journey[state.lang]===0?'첫 번째 산책':'두 번째 산책')+'</strong><p>'+glyphs().join(' · ')+' 소리와 모양을 만나고 구별해요.</p></div><span class="tb-pill">'+plan().filter(x=>done(x.id)).length+' 활동 완료</span></div><label class="tb-parent-row"><div><strong>이번 산책에 쓰기 넣기</strong><p>듣기와 소리 놀이만 먼저 할 수도 있어요.</p></div><input type="checkbox" data-setting="writing" '+(state.writing?'checked':'')+'></label><div class="tb-parent-row"><div><strong>놀이에서 처음 고른 답</strong><p>힌트로 맞힌 답과 구분해서 확인해요.</p></div><strong>'+(state.scores[pathKey()]==null?'아직 기록 없음':state.scores[pathKey()]+' / 3')+'</strong></div><div class="tb-parent-row"><div><strong>다음 산책</strong><p>'+nextGlyphs()+' 친구를 만나요.</p></div><span>'+ (state.unlocked[pathKey()]?'길이 열렸어요':'소리 놀이 후 안내')+'</span></div></section>';}
  function render(){root.dataset.lang=state.lang;root.querySelector('.tb-nav').hidden=state.screen==='home';root.querySelectorAll('[data-action=language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state.lang)));root.querySelectorAll('.tb-nav button').forEach(b=>{const active=state.screen===b.dataset.action||(b.dataset.action==='map'&&['activity','finish'].includes(state.screen)&&state.mode==='guided')||(b.dataset.action==='free'&&state.screen==='activity'&&state.mode==='free');if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=({home,map,activity,free,finish,parent}[state.screen]||home)();if(window.lucide)lucide.createIcons();root.querySelector('.tb-nav button[data-action=home]').innerHTML=icon('house')+' '+(state.lang==='ko'?'한글':'영어')+' 학습';if(window.lucide)lucide.createIcons();if(state.screen==='activity'&&plan()[state.selected]?.type==='write')bindDrawing();}
  function mark(id){if(!done(id))state.progress[state.lang].push(state.journey[state.lang]+':'+id);}
  function speak(){if(!('speechSynthesis' in window))return;const s=plan()[state.selected],g=s.type==='game'?glyphs()[[0,1,0][Math.min(quizRound,2)]]:s.glyph,text=state.lang==='ko'?({'ㅏ':'아','ㅑ':'야','ㅓ':'어','ㅕ':'여'}[g]||g):g;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=state.lang==='ko'?'ko-KR':'en-US';utterance.rate=.8;window.speechSynthesis.speak(utterance);}
  function bindDrawing(){const canvas=main.querySelector('canvas'),ctx=canvas.getContext('2d');let drawing=false,last=null;function pos(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*380/r.width,y:(e.clientY-r.top)*400/r.height};}canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const point=pos(e);ctx.strokeStyle=getComputedStyle(root).getPropertyValue('--tb-accent').trim();if(!ctx.strokeStyle||ctx.strokeStyle.indexOf('light-dark')>=0)ctx.strokeStyle=getComputedStyle(root.querySelector('.tb-pill')).color;ctx.lineWidth=17;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(point.x,point.y);ctx.stroke();last=point;drew=true;});canvas.addEventListener('pointerup',()=>{drawing=false;if(drew){main.querySelector('.tb-sheet-label').textContent='그렸어요. 다음 친구를 만나볼까요?';main.querySelector('.tb-footer').innerHTML=action('advance','다음으로 '+icon('arrow-right'));if(window.lucide)lucide.createIcons();}});canvas.addEventListener('pointercancel',()=>{drawing=false;});}
  root.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;const a=button.dataset.action;
    if(['home','map','free','parent'].includes(a)){state.screen=a;if(a==='free')state.mode='free';render();save();return;}
    if(a==='language'){state.lang=button.dataset.value;state.screen='home';resetLocal();render();save();return;}
    if(a==='continue'){state.journey[state.lang]=state.unlocked[state.lang+'-0']?1:0;openActivity(current(),'guided');return;}
    if(a==='choose-path'){const index=Number(button.dataset.index);if(index!==0&&index!==1)return;if(state.screen==='map'&&index===1&&!state.unlocked[state.lang+'-0'])return;state.journey[state.lang]=index;render();save();return;}
    if(a==='next-path'&&state.unlocked[pathKey()]&&state.journey[state.lang]===0){state.journey[state.lang]=1;openActivity(current(),'guided');return;}
    if(a==='stage'||a==='free-stage'){openActivity(Number(button.dataset.index),a==='free-stage'?'free':'guided');return;}
    if(a==='free-tab'){state.freeTab=button.dataset.value;render();save();return;}
    if(a==='listen'){speak();taps=Math.min(3,taps+1);render();main.querySelector('.tb-toy')?.classList.add('tb-pop');if(taps===3)announce('소리를 세 번 만났어요. 다음으로 갈 수 있어요.');return;}
    if(a==='advance'){const p=plan(),s=p[state.selected];mark(s.id);if(state.mode==='free'){state.screen='free';render();save();}else{const next=state.selected+1;if(next<p.length)openActivity(next,'guided');else{state.screen='finish';render();save();}}return;}
    if(a==='audio'){speak();return;}
    if(a==='answer'){const target=[0,1,0][quizRound],answer=Number(button.dataset.index);if(firstAnswers[quizRound]===undefined)firstAnswers[quizRound]=answer===target;if(answer===target){answered=true;correctCount++;feedback='찾았어요!';button.classList.add('right','tb-pop');main.querySelectorAll('.tb-choice').forEach(b=>b.disabled=true);main.querySelector('.tb-feedback').textContent=feedback;main.querySelector('.tb-footer').innerHTML=action('next-question','다음 소리 '+icon('arrow-right'));if(window.lucide)lucide.createIcons();announce(feedback);}else{feedback='소리를 한 번 더 들어봐요';button.classList.add('wrong');main.querySelector('.tb-feedback').textContent=feedback;announce(feedback);}return;}
    if(a==='next-question'){quizRound++;answered=false;feedback='';render();return;}
    if(a==='game-finish'){const score=firstAnswers.filter(Boolean).length;state.scores[pathKey()]=score;mark('game');state.unlocked[pathKey()]=state.unlocked[pathKey()]||score>=2;state.screen='finish';render();save();announce(state.unlocked[pathKey()]?'다음 길이 열렸어요':'소리를 한 번 더 만나봐요');return;}
    if(a==='retry-game'){openActivity(plan().length-1,'guided');return;}
  });
  root.addEventListener('change',e=>{if(e.target.dataset.setting==='writing'){state.writing=e.target.checked;state.selected=0;render();save();}});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);resetLocal();render();}});
  render();
  if(window.Tweak){const controls={roundness:28};const tweak=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.tb-home,.tb-map,.tb-playfield').forEach(el=>el.style.borderRadius=controls.roundness+'px');}});tweak.addSlider(controls,'roundness',{label:'풍경 모서리',min:12,max:40,unit:'px'});}
})();
</script>
