<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>활동 연결 — 개발 미리보기</title>
  </head>
  <body>
    <div style="padding: 12px; font: 13px sans-serif; background: #fffaf0">
      개발 미리보기 · 가상 완료 화면 · 실제 학습 진도 저장 없음
    </div>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { MemoryRouter } from 'react-router-dom';
      import '/src/index.css';
      import '/src/i18n/index.ts';
      import { PhonicsActivityFinish } from '/src/features/phonics-learner/components/PhonicsActivityFinish.tsx';
      import { PhonicsCurriculumPath } from '/src/features/phonics-learner/components/PhonicsCurriculumPath.tsx';
      import {
        journeyProgress,
        journeySteps,
      } from '/src/features/phonics-learner/lib/learning-journey.ts';
      const lang =
        new URLSearchParams(location.search).get('lang') === 'english' ? 'english' : 'korean';
      const steps = journeySteps(lang);
      const unitId = steps[0].unit.id;
      function Preview() {
        const [index, setIndex] = React.useState(1);
        const next = steps[index];
        const chapterDone = !next || next.unit.id !== unitId;
        if (index === -1) {
          const progress = journeyProgress(lang, (id) =>
            id === unitId
              ? steps.filter((s) => s.unit.id === unitId).map((s) => s.activity.key)
              : []
          );
          return React.createElement(
            MemoryRouter,
            { initialEntries: [`/library/phonics/${lang}?mode=curriculum&finished=${unitId}`] },
            React.createElement(PhonicsCurriculumPath, {
              lang,
              progress,
              started: true,
              finishedUnitDone: true,
            })
          );
        }
        return React.createElement(PhonicsActivityFinish, {
          lang,
          next,
          chapterDone,
          onNext: () => setIndex(chapterDone ? -1 : index + 1),
          onExit: () => setIndex(-1),
        });
      }
      createRoot(document.getElementById('root')).render(React.createElement(Preview));
    </script>
  </body>
</html>
