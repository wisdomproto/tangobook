<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🔍 숨은그림 찾기</title>
<!--
  붙여넣은 씬(comic-assets/hidden-object-plan)과 손으로 잡은 사물 자리(hidden-object-hotspots.json)로
  바로 노는 한 장짜리 게임. 앱 안 게임(HiddenObjectPlayer)과 **같은 데이터**를 본다.

  🔴 낱말 음원은 책에서 온다 — 한국어 key_objects[].ttsUrl, 영어 ttsUrls.en.
     한국어가 비어 있는 낱말이 있어(개구리 왕자 「공」) 그때만 서버에 이어읽기를 시킨다.
-->
<style>
  :root{
    --ink:#2b2b31; --soft:#6b6b76; --line:#e6e3dd; --cream:#fdfaf4;
    --coral:#ff6f61; --mint:#5ec8b6; --ok:#2aa876;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
       color:var(--ink);background:var(--cream);display:flex;min-height:100vh}

  aside{width:210px;flex:0 0 210px;background:#fff;border-right:1.5px solid var(--line);
        height:100vh;position:sticky;top:0;overflow-y:auto;padding:16px 0 40px}
  aside h1{font-size:15px;margin:0 16px 12px;font-weight:900}
  .bk{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
      padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--soft);border-left:3px solid transparent}
  .bk:hover{background:#faf8f4}
  .bk.on{color:var(--ink);background:#f4fbf9;border-left-color:var(--mint);font-weight:900}
  .bk .n{float:right;font-size:11.5px;color:#9a9aa4;font-weight:700}
  .bk .n.done{color:var(--ok)}

  main{flex:1;min-width:0;padding:16px 22px 40px;display:flex;flex-direction:column;align-items:center}
  .top{width:100%;max-width:1100px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .top h2{font-size:19px;margin:0;font-weight:900}
  .top .sub{font-size:13px;color:var(--soft)}
  .lang{margin-left:auto;display:flex;gap:6px}
  .lang button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 14px;
               font-size:13px;font-weight:800;cursor:pointer;color:var(--soft)}
  .lang button.on{border-color:var(--coral);color:var(--coral);background:#fff5f3}

  /* 🔴 그림이 화면을 다 먹으면 **찾을 낱말 줄이 화면 밖으로 밀린다** — 무엇을 찾는지 모른 채
     그림만 본다. 높이를 화면에 맞춰 잘라 두 개가 한 화면에 같이 있게 한다. */
  .stage{position:relative;display:inline-block;max-width:1100px;border-radius:16px;overflow:hidden;
         background:#fff;border:1.5px solid var(--line);line-height:0;cursor:crosshair}
  .stage img{display:block;max-height:56vh;max-width:100%;width:auto}
  /* 🔴 찾은 자리는 **멀리서도 보여야** 한다 — 흰 실선 하나는 빽빽한 그림 위에서 사라진다. */
  .ring{position:absolute;border:4px solid var(--ok);border-radius:14px;background:rgba(42,168,118,.28);
        box-shadow:0 0 0 3px #fff,0 0 20px rgba(0,0,0,.4);pointer-events:none;animation:pop .45s ease-out}
  @keyframes pop{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}
  .miss{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
        background:rgba(0,0,0,.28);pointer-events:none;animation:fade .5s ease-out forwards}
  @keyframes fade{to{opacity:0;transform:scale(1.6)}}

  .rail{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 4px;max-width:1100px}
  .t{width:96px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;
     line-height:1.3}
  .t img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 2px}
  .t .ph{width:64px;height:64px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;
         font-size:26px;color:#cfcac2}
  .t b{font-size:14px;font-weight:900;display:block}
  .t.got{border-color:var(--ok);background:#f2fcf8;opacity:.55}
  .t.got b::after{content:' ✓';color:var(--ok)}
  .t.hint{animation:bounce .5s}
  @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}

  .msg{font-size:15px;font-weight:800;color:var(--soft);margin-top:10px;min-height:24px;text-align:center}
  .msg.win{color:var(--ok);font-size:19px}
  .again{margin-top:10px;border:0;background:var(--coral);color:#fff;border-radius:12px;
         padding:11px 26px;font-size:15px;font-weight:900;cursor:pointer}
  @media (max-width:820px){
    body{display:block}
    aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1.5px solid var(--line);
          display:flex;overflow-x:auto;padding:8px}
    aside h1{display:none}
    .bk{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
    .bk.on{border-left:0;border-bottom-color:var(--mint)}
    .bk .n{float:none;margin-left:6px}
    main{padding:12px}
  }
</style>
</head>
<body>
<aside><h1>🔍 숨은그림 찾기</h1><div id="nav"></div></aside>
<main>
  <div class="top">
    <h2 id="title">불러오는 중…</h2>
    <span class="sub" id="count"></span>
    <div class="lang">
      <button id="ko" class="on">한국어</button>
      <button id="en">English</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="rail" id="rail"></div>
  <div class="msg" id="msg"></div>
</main>

<script>
(function () {
  'use strict';
  var DOC = 'hidden-object-plan';
  var assets = {}, hotspots = {};
  var books = [];        // 자리를 잡아 둔 씬만
  var bi = 0, lang = 'ko';
  var cur = null;
  var bookCache = {};    // bookId -> Promise<storybook> (음원·이름이 여기 있다)
  var ttsCache = {};
  var cleared = {};

  function el(id) { return document.getElementById(id); }
  function play(src, vol) {
    if (!src) return;
    var a = new Audio(src);
    a.volume = vol == null ? 1 : vol;
    a.play().catch(function () {});
  }

  /**
   * 🔴 낱말 음원은 **책에 있는 녹음**을 쓴다 — 한국어 ttsUrl, 영어 ttsUrls.en.
   *    한국어가 빈 낱말이 있어(개구리 왕자 「공」) 그때만 서버에 이어읽기를 시킨다.
   */
  function wordAudio(t) {
    // 🔴 책을 **기다린다** — 첫 탭이 책보다 빨라서 녹음을 두고 서버에 합성을 시키던 것을 막는다.
    return (cur.bookP || Promise.resolve(null)).then(function (book) {
      return pickAudio(book, t);
    });
  }

  /**
   * 🔴 **낱말 이름으로 그냥 못 찾는다.** 작업판 목록은 `nameEn`(`crown`)인데 책의
   *    `key_objects[].name` 은 책마다 제각각이다(`Crown`·`공`이 한 책에 섞여 있다).
   *    한국어로 먼저 찾고 없으면 대소문자를 무시한다 — 링커와 같은 규칙이다.
   *    이걸 안 하면 녹음이 멀쩡히 있는데도 서버에 합성을 시킨다(실측: 「왕관」이 그랬다).
   */
  function findKeyObject(book, t) {
    var list = (book && book.key_objects) || [];
    var lc = function (v) { return (v || '').trim().toLowerCase(); };
    return (
      list.filter(function (k) { return (k.korean || '').trim() === t.ko; })[0] ||
      list.filter(function (k) { return lc(k.nameEn) === lc(t.en); })[0] ||
      list.filter(function (k) { return lc(k.name) === lc(t.en); })[0]
    );
  }

  /** 책의 낱말 카드 그림 — 배경 낱말은 작업판 목록에 없어서 여기서 채운다. */
  function bookCard(t) {
    var book = cur && cur.book;
    var ko = findKeyObject(book, t);
    if (!ko) return null;
    var img = ((book && book.keyObjectImages) || []).filter(function (i) {
      return i.objectName === ko.name && i.success;
    })[0];
    return img ? img.imageUrl : null;
  }

  function pickAudio(book, t) {
    var ko = findKeyObject(book, t);
    if (lang === 'en') return Promise.resolve(ko && ko.ttsUrls && ko.ttsUrls.en);
    if (ko && ko.ttsUrl) return Promise.resolve(ko.ttsUrl);
    var ck = 'ko|' + t.ko;
    if (ttsCache[ck]) return Promise.resolve(ttsCache[ck]);
    return fetch('/api/phonics-library/concat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: t.ko,
        storybookId: cur.cell.bookId,
        identifier: 'hobj-ko-' + encodeURIComponent(t.ko),
        language: 'korean'
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var u = j && j.data && j.data.audioUrl;
        if (u) ttsCache[ck] = u;
        return u;
      })
      .catch(function () { return null; });
  }

  function renderNav() {
    var nav = el('nav');
    nav.innerHTML = '';
    books.forEach(function (b, i) {
      var btn = document.createElement('button');
      btn.className = 'bk' + (i === bi ? ' on' : '');
      var n = Object.keys(hotspots[b.cell.key]).length;
      btn.innerHTML = b.title + '<span class="n' + (cleared[b.cell.key] ? ' done' : '') + '">' +
        (cleared[b.cell.key] ? '✓ ' : '') + n + '</span>';
      btn.onclick = function () { bi = i; start(); };
      nav.appendChild(btn);
    });
  }

  function label(t) { return lang === 'en' ? t.en : t.ko; }

  function renderRail() {
    var rail = el('rail');
    rail.innerHTML = '';
    cur.targets.forEach(function (t, i) {
      var d = document.createElement('div');
      d.className = 't' + (t.got ? ' got' : '');
      d.id = 'tgt' + i;
      // 🔴 배경 낱말(연못·하늘)은 **작업판 목록에 카드가 안 붙어 있다** — 카드는 words 에만 달린다.
      //    그런데 책에는 있다(개구리 왕자 「연못」). 책이 오면 거기서 찾아 채운다.
      var card = t.card || bookCard(t);
      d.innerHTML = (card ? '<img src="' + card + '" alt="">' : '<div class="ph">🔎</div>') +
        '<b>' + label(t) + '</b>';
      rail.appendChild(d);
    });
  }

  function say(text, win) {
    var m = el('msg');
    m.className = 'msg' + (win ? ' win' : '');
    m.textContent = text;
  }

  function left() {
    return cur.targets.filter(function (t) { return !t.got; }).length;
  }

  function start() {
    var b = books[bi];
    var words = b.cell.words.concat(b.cell.parts || []).concat(b.cell.scenery || []);
    // 🔴 책은 **음원과 이름 때문에** 받는다. 못 받아도 그림은 놀 수 있으니 진행을 막지 않는다.
    if (!bookCache[b.bookId]) {
      bookCache[b.bookId] = fetch('/api/storybooks/' + b.bookId)
        .then(function (r) { return r.json(); })
        .then(function (j) { return (j && j.data) || null; })
        .catch(function () { return null; });
    }
    // 🔴 책이 늦게 와도 **그때 다시 그린다** — 안 그러면 배경 낱말 카드가 영영 빈 채로 남는다.
    bookCache[b.bookId].then(function (book) {
      if (!cur || cur.cell.key !== b.cell.key || !book) return;
      cur.book = book;
      renderRail();
    });
    cur = {
      cell: b.cell,
      book: null,
      bookP: bookCache[b.bookId],
      targets: Object.keys(hotspots[b.cell.key]).map(function (en) {
        var w = words.filter(function (x) { return x.en === en; })[0] || {};
        // 배경 낱말(연못·하늘·마을)은 뒤 층 — 작업판이 `scenery` 로 갈라 놓은 그대로다.
        var scenery = (b.cell.scenery || []).some(function (p) { return p.en === en; });
        // 🔴 몸의 부분(귀·코·이빨)은 **사물보다 위** — 그 동물 몸 위에 얹혀 있어서,
        //    같은 층이면 큰 몸 상자가 작은 귀를 삼킨다. 링커와 같은 규칙이다.
        var part = (b.cell.parts || []).some(function (p) { return p.en === en; });
        return {
          en: en, ko: w.ko || en, card: w.card || null, name: en,
          box: hotspots[b.cell.key][en], got: false, layer: scenery ? 0 : part ? 2 : 1,
        };
      })
    };
    el('title').textContent = b.title;
    el('count').textContent = b.cell.genreLabel;
    el('stage').innerHTML = '<img id="scene" src="' + assets[b.cell.key] + '" alt="">';
    renderNav();
    renderRail();
    say('숨은 그림 ' + cur.targets.length + '개를 찾아보세요!');
  }

  function hit(e) {
    if (!cur) return;
    var img = el('scene');
    if (!img || !img.naturalWidth) return;
    var r = img.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 100;
    var y = ((e.clientY - r.top) / r.height) * 100;
    if (x < 0 || y < 0 || x > 100 || y > 100) return;

    // 🔴 상자는 **겹쳐도 된다.** 겹친 자리는 **앞 층이 가져가고**(연못 위의 오리), 같은 층이면
    //    **작은 쪽이 이긴다**(옷장 안의 셔츠). 앱 안 게임과 같은 규칙이다.
    var under = cur.targets.filter(function (t) {
      var b = t.box;
      return !t.got && x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3];
    }).sort(function (a, c) {
      return c.layer - a.layer || a.box[2] * a.box[3] - c.box[2] * c.box[3];
    });

    if (under.length) {
      var t = under[0];
      var b = t.box; // [x,y,w,h] 퍼센트
      {
        t.got = true;
        var ring = document.createElement('div');
        ring.className = 'ring';
        ring.style.left = b[0] + '%';
        ring.style.top = b[1] + '%';
        ring.style.width = b[2] + '%';
        ring.style.height = b[3] + '%';
        el('stage').appendChild(ring);
        play('/sounds/game/correct.mp3', 0.5);
        // 🔴 띵동 **먼저**, 낱말은 그 뒤에 — 겹치면 둘 다 안 들린다.
        wordAudio(t).then(function (u) { setTimeout(function () { play(u); }, 420); });
        renderRail();
        var n = left();
        if (n === 0) {
          cleared[cur.cell.key] = true;
          renderNav();
          play('/sounds/ui/reward.mp3', 0.6);
          say('다 찾았어요! 🎉', true);
          var again = document.createElement('button');
          again.className = 'again';
          again.textContent = books[bi + 1] ? '다음 그림 →' : '다시 하기';
          again.onclick = function () { if (books[bi + 1]) bi++; start(); };
          el('msg').appendChild(document.createElement('br'));
          el('msg').appendChild(again);
        } else {
          say(n + '개 더 찾아보세요!');
        }
        return;
      }
    }
    // 🔴 빗나가도 벌은 없다 — 아직 못 찾은 낱말 하나가 통통 튀어 「거기 말고 이거」를 알려 줄 뿐.
    var miss = document.createElement('div');
    miss.className = 'miss';
    miss.style.left = x + '%';
    miss.style.top = y + '%';
    el('stage').appendChild(miss);
    setTimeout(function () { miss.remove(); }, 500);
    play('/sounds/ui/toggle.mp3', 0.5);
    for (var j = 0; j < cur.targets.length; j++) {
      if (cur.targets[j].got) continue;
      var card = el('tgt' + j);
      if (card) {
        card.classList.add('hint');
        (function (c) { setTimeout(function () { c.classList.remove('hint'); }, 500); })(card);
      }
      break;
    }
  }

  el('stage').addEventListener('click', hit);
  el('ko').onclick = function () { lang = 'ko'; el('ko').className = 'on'; el('en').className = ''; renderRail(); };
  el('en').onclick = function () { lang = 'en'; el('en').className = 'on'; el('ko').className = ''; renderRail(); };

  // 🔴 목록 파일이 라인마다 따로다(명작 · 전래 `-jr` · 자연관찰 `-nt`). 키가 갈려 있어 합쳐도 안 부딪힌다.
  //    아직 안 만든 라인은 404 라 빈 목록으로 넘긴다.
  var PLANS = ['', '-jr', '-nt'].map(function (sfx) {
    return fetch('/hidden-object-plan-data' + sfx + '.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : { sections: [] }; })
      .catch(function () { return { sections: [] }; });
  });

  Promise.all([
    Promise.all(PLANS).then(function (ps) {
      return { sections: ps.reduce(function (a, p) { return a.concat(p.sections || []); }, []) };
    }),
    fetch('/hidden-object-hotspots.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }),
    fetch('/api/comic-assets/' + DOC).then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (res) {
    var cells = [];
    res[0].sections.forEach(function (s) { cells = cells.concat(s.items); });
    hotspots = res[1];
    delete hotspots._;
    assets = (res[2] && res[2].data) || {};
    books = cells
      .filter(function (c) { return hotspots[c.key] && assets[c.key]; })
      .map(function (c) { return { bookId: c.bookId, title: c.bookTitle, cell: c }; });
    if (!books.length) { el('title').textContent = '아직 자리를 잡은 그림이 없어요.'; return; }
    start();
  }).catch(function (e) {
    el('title').textContent = '못 불러왔어요: ' + e.message;
  });
})();
</script>
</body>
</html>
