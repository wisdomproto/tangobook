<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>낱말 연결 그래프 — 파닉스 ↔ 동화책</title>
<!--
  파닉스 단원의 타겟 낱말이 어느 동화책에 나오는지 실로 잇는다.

  🔴 데이터는 여기서 만들지 않는다 — `content-status.json` 의 `graph` 를 읽는다.
     다시 구우려면: node packages/server/scripts/build-content-status.mjs
     (크롤이 비싸서 현황판과 **같은 실행**에서 뽑는다. 여기서 API 를 또 때리지 말 것.)

  🔴 링크를 전부 그리면 실타래가 된다 — 단원을 고르면 그 단원 것만 그린다.
-->
<style>
:root{
  --bg:#FBF8F4; --sf:#fff; --sunk:#F4EEE5; --ink:#1F1B18; --mut:#6B615A; --faint:#8A7F76; --line:#E5DCD0;
  --kr:#E4572E; --krw:#FBEBE4; --bk:#17A184; --bkw:#E4F4EF; --acc:#C08A16; --accw:#F8F0DC; --z:#B4A99D;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#16130F; --sf:#201C18; --sunk:#1B1713; --ink:#F1EBE2; --mut:#B0A69C; --faint:#948A81; --line:#332C25;
  --kr:#FF7A54; --krw:#2E1F18; --bk:#3FCFAE; --bkw:#142723; --acc:#E0B457; --accw:#2A2216; --z:#5E554D;
}}
:root[data-theme=dark]{
  --bg:#16130F; --sf:#201C18; --sunk:#1B1713; --ink:#F1EBE2; --mut:#B0A69C; --faint:#948A81; --line:#332C25;
  --kr:#FF7A54; --krw:#2E1F18; --bk:#3FCFAE; --bkw:#142723; --acc:#E0B457; --accw:#2A2216; --z:#5E554D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:1600px;margin:0 auto;padding:24px clamp(12px,2.5vw,26px) 40px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.03em}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 18px}
.sub code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:.85rem}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.tab{padding:7px 16px;border:1px solid var(--line);background:var(--sf);color:var(--mut);border-radius:999px;
  font:inherit;font-size:.9rem;cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--acc)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.spacer{flex:1}
.pill{font-size:.82rem;color:var(--mut);background:var(--sunk);border-radius:999px;padding:5px 12px}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}

.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 210px minmax(0,1fr);gap:0;
  border:1px solid var(--line);border-radius:14px;background:var(--sf);overflow:hidden}
@media(max-width:900px){.stage{grid-template-columns:1fr;}.mid{display:none}}
.col{max-height:74vh;overflow:auto;padding:14px}
.col.right{border-left:1px solid var(--line)}
@media(max-width:900px){.col.right{border-left:0;border-top:1px solid var(--line)}}
.colhd{position:sticky;top:-14px;margin:-14px -14px 10px;padding:11px 14px;background:var(--sunk);
  border-bottom:1px solid var(--line);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mut);font-weight:600;z-index:5}
.mid{position:relative;background:linear-gradient(180deg,transparent,var(--sunk)08,transparent)}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

.unit{border:1px solid var(--line);border-radius:11px;margin:0 0 8px;background:var(--sf);transition:.15s;cursor:pointer}
.unit:hover{border-color:var(--kr)}
.unit[aria-selected=true]{border-color:var(--kr);box-shadow:0 0 0 3px var(--krw)}
.unit .uh{display:flex;align-items:center;gap:9px;padding:9px 12px}
.uid{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ut{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ratio{font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.r-full{background:var(--bkw);color:var(--bk)} .r-part{background:var(--accw);color:var(--acc)}
.r-none{background:var(--krw);color:var(--kr)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 11px}
.chip{font-size:.83rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);
  color:var(--mut);transition:.15s}
.chip.on{background:var(--krw);border-color:var(--kr);color:var(--kr);font-weight:600}
.chip.off{opacity:.5;text-decoration:line-through;text-decoration-thickness:1px}
.book .chip.on{background:var(--bkw);border-color:var(--bk);color:var(--bk)}

.book{border:1px solid var(--line);border-radius:11px;margin:0 0 8px;background:var(--sf);transition:.15s}
.book .bh{display:flex;align-items:baseline;gap:8px;padding:9px 12px}
.bt{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc{font-size:.74rem;color:var(--faint);white-space:nowrap}
.tree{font-size:.7rem;color:var(--faint);margin-right:2px}
.empty{color:var(--mut);padding:28px 12px;text-align:center;font-size:.9rem}
.note{background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:13px 16px;margin:16px 0 0;
  color:var(--mut);font-size:.87rem}
.note b{color:var(--ink)}
.miss{color:var(--kr);font-weight:600}
</style>

<div class="wrap">
<h1>낱말 연결 그래프</h1>
<p class="sub">파닉스에서 배운 낱말이 <b>어느 동화책에 나오는가</b>. 왼쪽 단원을 누르면 그 단원의 실만 보인다.<br>
데이터 = <code>/api/content-status</code>(라이브) · 없으면 <code>content-status.json</code> · 다시 구우려면 <code>node packages/server/scripts/build-content-status.mjs</code></p>

<div class="bar" id="tabs"></div>
<div class="bar">
  <span class="pill" id="sum">…</span>
  <span class="pill" id="pick">…</span>
  <span class="spacer"></span>
  <button class="tab" id="all">전체 단원 보기</button>
</div>

<div class="stage">
  <div class="col left"><div class="colhd">파닉스 단원 › 타겟 낱말</div><div id="L"></div></div>
  <div class="mid"><svg class="links" id="svg"></svg></div>
  <div class="col right"><div class="colhd">동화책 › 핵심 낱말</div><div id="R"></div></div>
</div>

<div class="note" id="foot"></div>
</div>

<script>
(function(){
  var TRACK_LABEL={kr:'한글',en:'영어',zh:'중국어',ja:'일본어'};
  var D=null, track=null, sel=null, showAll=false;
  var L=document.getElementById('L'), R=document.getElementById('R'), SVG=document.getElementById('svg');

  // 🔴 라이브(/api/content-status)를 먼저 본다 — 정적 파일만 쓰면 프로덕션에서 배포 시점에 멈춘다.
  //    서버가 없거나(파일로 직접 열기) 실패하면 구워둔 정적 파일로 떨어진다.
  function load(){
    return fetch('/api/content-status',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.json() })
      .then(function(j){ return j.data||j })
      .catch(function(){ return fetch('/content-status.json',{cache:'no-store'}).then(function(r){return r.json()}) });
  }
  load().then(function(j){
    D=j.graph||{};
    var ks=Object.keys(D);
    if(!ks.length){L.innerHTML='<div class="empty">graph 데이터가 없다. 현황판을 다시 구워라.</div>';return}
    var tabs=document.getElementById('tabs');
    ks.forEach(function(k){
      var b=document.createElement('button');
      b.className='tab'; b.textContent=(TRACK_LABEL[k]||k)+' 파닉스';
      b.onclick=function(){ setTrack(k) };
      b.dataset.k=k; tabs.appendChild(b);
    });
    setTrack(ks.indexOf('kr')>=0?'kr':ks[0]);
  }).catch(function(e){
    L.innerHTML='<div class="empty">content-status.json 을 못 읽었다 — 같은 폴더에 있어야 한다.<br>'+e+'</div>';
  });

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function setTrack(k){
    track=k; sel=null; showAll=false;
    [].forEach.call(document.querySelectorAll('#tabs .tab'),function(b){
      b.setAttribute('aria-selected', b.dataset.k===k?'true':'false')});
    render();
  }

  document.getElementById('all').onclick=function(){ showAll=!showAll; sel=null; render() };

  /** 지금 그릴 단원들 */
  function activeUnits(){
    var g=D[track]; if(!g) return [];
    if(showAll) return g.units;
    if(sel==null) return [];
    return g.units.filter(function(u){return u.id===sel});
  }

  function render(){
    var g=D[track]; if(!g) return;
    var words=0,covered=0;
    g.units.forEach(function(u){ u.words.forEach(function(w){ words++; if(w.books.length)covered++ }) });
    document.getElementById('sum').innerHTML=
      (TRACK_LABEL[track]||track)+' · 단원 <b>'+g.units.length+'</b> · 낱말 <b>'+words+'</b> · 책에 나옴 <b>'+covered+'</b>'+
      ' <span style="opacity:.7">('+(words?Math.round(covered/words*100):0)+'%)</span>';

    // ── 왼쪽: 단원 트리
    L.innerHTML = g.units.map(function(u){
      var on=u.words.filter(function(w){return w.books.length}).length;
      var cls = on===u.words.length&&u.words.length ? 'r-full' : on ? 'r-part' : 'r-none';
      var isSel = showAll || u.id===sel;
      return '<div class="unit" data-u="'+esc(u.id)+'" aria-selected="'+(isSel?'true':'false')+'">'
        + '<div class="uh"><span class="uid">'+esc(u.id)+'</span>'
        + '<span class="ut">'+esc(u.title||'')+'</span>'
        + '<span class="ratio '+cls+'">'+on+'/'+u.words.length+'</span></div>'
        + '<div class="chips">'+u.words.map(function(w,i){
            return '<span class="chip '+(w.books.length?'on':'off')+'" data-w="'+esc(u.id)+'#'+i+'">'
              + '<span class="tree">└</span>'+esc(w.w)+'</span>' }).join('')
        + '</div></div>';
    }).join('');

    [].forEach.call(L.querySelectorAll('.unit'),function(el){
      el.onclick=function(){ showAll=false; sel = (sel===el.dataset.u? null : el.dataset.u); render() };
    });

    // ── 오른쪽: 고른 단원이 닿는 책만
    var us=activeUnits(), need={}, pairs=[];
    us.forEach(function(u){ u.words.forEach(function(w,i){
      w.books.forEach(function(bi){
        (need[bi]=need[bi]||[]).push(w.w);
        pairs.push({from:u.id+'#'+i, to:bi+'#'+w.w});
      });
    })});
    var bis=Object.keys(need).map(Number).sort(function(a,b){return need[b].length-need[a].length});

    document.getElementById('pick').innerHTML = showAll ? '전체 단원'
      : sel ? '고른 단원 <b>'+esc(sel)+'</b> · 잇는 책 <b>'+bis.length+'</b>권'
      : '<span style="opacity:.75">왼쪽에서 단원을 눌러라</span>';

    if(!bis.length){
      R.innerHTML='<div class="empty">'+(sel||showAll
        ? '이 단원의 낱말이 나오는 동화책이 없다.'
        : '단원을 고르면 여기에 그 낱말이 나오는 동화책이 뜬다.')+'</div>';
    } else {
      R.innerHTML = bis.map(function(bi){
        var b=g.books[bi]; if(!b) return '';
        var hit=need[bi].filter(function(v,i,a){return a.indexOf(v)===i});
        var more=Math.max(0,(b.words||0)-hit.length);
        return '<div class="book" data-b="'+bi+'">'
          + '<div class="bh"><span class="bt">'+esc(b.title)+'</span>'
          + '<span class="bc">'+esc(b.category)+(b.isPhonics?' · 나무 동화':'')+'</span></div>'
          + '<div class="chips">'+hit.map(function(w){
              return '<span class="chip on" data-t="'+bi+'#'+esc(w)+'"><span class="tree">└</span>'+esc(w)+'</span>' }).join('')
          + (more? '<span class="chip">+'+more+'개 더</span>':'')
          + '</div></div>';
      }).join('');
    }
    requestAnimationFrame(function(){ draw(pairs) });
    foot(g);
  }

  /** 왼쪽 칩 ↔ 오른쪽 칩을 베지에로 잇는다. 좌표는 SVG 기준으로 환산. */
  function draw(pairs){
    var box=SVG.getBoundingClientRect();
    SVG.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
    var seen={}, d='';
    var defs='<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--kr)"/>'
      +'<stop offset="1" stop-color="var(--bk)"/></linearGradient></defs>';
    pairs.forEach(function(p){
      var k=p.from+'>'+p.to; if(seen[k])return; seen[k]=1;
      var a=L.querySelector('[data-w="'+cssq(p.from)+'"]'), b=R.querySelector('[data-t="'+cssq(p.to)+'"]');
      if(!a||!b)return;
      var ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
      // 칼럼 밖으로 스크롤된 칩은 잇지 않는다 — 엉뚱한 데서 실이 나오는 것처럼 보인다.
      var lc=L.parentElement.getBoundingClientRect(), rc=R.parentElement.getBoundingClientRect();
      if(ar.bottom<lc.top||ar.top>lc.bottom||br.bottom<rc.top||br.top>rc.bottom)return;
      var x1=0, y1=ar.top+ar.height/2-box.top, x2=box.width, y2=br.top+br.height/2-box.top;
      var m=box.width/2;
      d+='<path d="M'+x1+','+y1+' C'+m+','+y1+' '+m+','+y2+' '+x2+','+y2+'" fill="none" stroke="url(#g)" '
        +'stroke-width="1.6" stroke-opacity=".55" stroke-linecap="round"/>';
    });
    SVG.innerHTML = defs + d;
  }
  function cssq(s){ return String(s).replace(/["\\]/g,'\\$&') }

  function foot(g){
    var miss=[];
    g.units.forEach(function(u){ u.words.forEach(function(w){ if(!w.books.length) miss.push(w.w) }) });
    document.getElementById('foot').innerHTML =
      '🔴 <b>나무 동화(한글 나무·ABC 나무)도 동화책이다</b> — 오른쪽에 <b>「나무 동화」</b>로 표시된다. '
      + '메인 라인업 밖이라고 빼고 세면 없는 구멍이 생긴다.<br>'
      + (miss.length
          ? '이 트랙에서 <b>어느 책에도 안 나오는 낱말</b> '+miss.length+'개: <span class="miss">'+miss.map(esc).join(' · ')+'</span>'
          : '이 트랙의 모든 낱말이 동화책에 나온다.');
  }

  // 스크롤·리사이즈하면 실을 다시 그린다.
  var raf=null;
  function redraw(){ if(raf)return; raf=requestAnimationFrame(function(){ raf=null; render() }) }
  L.parentElement.addEventListener('scroll',redraw,{passive:true});
  R.parentElement.addEventListener('scroll',redraw,{passive:true});
  addEventListener('resize',redraw);
})();
</script>
</html>
