<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>문장 되맞추기 — 프로토타입</title>
    <!--
      동화책 문장 되맞추기 — 그래빗(문장 만들기 보드게임)의 4~7세판 시안.

      🔴 그래빗과 다른 점 = **정답 문장이 이미 있다.** 그래빗은 임의 조합이 문법에 맞는지
         판정해야 하고(그래서 실물은 사람이 판정한다) 우리는 그 쪽의 실제 문장과 배열을
         비교하면 끝이다. 문법 엔진도 LLM 도 필요 없다.

      🔴 소리 = **어절 하나하나 + 문장 전체**를 미리 구워 둔다
         (`/sentence-order-audio/`, 생성기 `packages/server/scripts/build-sentence-order-audio.mjs`).
         목소리는 책 나레이션과 같은 것 — voicebox `qwen` 1.7B + `Tangobook Narrator KO`.
         ❌ **쪽 나레이션(`page.ttsUrl`)은 못 쓴다** — 쪽 전체를 읽어(2~6문장 10~26초)
            타일 하나에 대응하는 소리가 없다.
         ❌ **쪽 mp3 를 무음으로 자르는 것도 안 된다** — 문장 4개에 무음이 7~11개 나오고
            (쉼표에서도 쉰다) 「가장 긴 N−1개에서 자르기」로 재 보니 30쪽 중 10쪽만
            맞았다(r≥0.90). 다시 시도하지 말 것.
         ⚠️ 그래서 이 시안은 **구워 둔 한 권**(manifest.json)만 논다. 다른 책·영어로 넓히려면
            그 책 음원을 먼저 구워야 한다 — 서버 TTS 는 지금 막혀 있다(gemini 429 · google 403).

      🔴 실데이터를 쓴다 — `/api/storybooks`. 프리뷰 서버(client-prod-api)가 프록시하므로
         `http://localhost:<port>/sentence-order.html` 로 열어야 한다. file:// 은 CORS 로 막힌다.
    -->
    <style>
      :root {
        --cream-50: #fff9f3;
        --cream-100: #fff3e8;
        --peach-100: #fff0e0;
        --peach-200: #ffddbf;
        --peach-300: #ffc19b;
        --coral-400: #ff7a59;
        --coral-500: #ff5e3a;
        --coral-600: #e84b2a;
        --mint-100: #d8f3e7;
        --mint-300: #87d3ba;
        --mint-500: #3aa87e;
        --mint-600: #2a8761;
        --ink-300: #c9b8a8;
        --ink-500: #9a8474;
        --ink-700: #3f2f24;
        --ink-900: #0b0805;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      /* 🔴 `display` 를 지정한 클래스는 브라우저 기본 `[hidden]{display:none}` 을 이긴다.
         이게 없으면 `hidden` 인 #status(fixed·inset:0)가 화면 위에 그대로 남아
         **보이지 않는 채로 모든 탭을 먹는다.** 자바스크립트 `.click()` 은 직접 호출이라
         이 상태에서도 먹혀서, 스크립트 검증만으로는 절대 안 잡힌다. */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--cream-50);
        color: var(--ink-900);
        font-family:
          Pretendard,
          'Pretendard Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── 헤더 ─────────────────────────────────────────────── */
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px clamp(12px, 3vw, 28px);
        flex-wrap: wrap;
      }
      .title {
        font-weight: 900;
        font-size: clamp(15px, 2.2vw, 20px);
        margin-right: auto;
        color: var(--ink-700);
      }
      .score {
        font-weight: 900;
        color: var(--coral-600);
        font-size: clamp(15px, 2.2vw, 20px);
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      .chip {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        background: #fff;
        border: 2px solid var(--peach-200);
        color: var(--ink-700);
        font-weight: 800;
        font-size: clamp(12px, 1.6vw, 15px);
      }
      .chip[aria-pressed='true'] {
        background: var(--coral-500);
        border-color: var(--coral-500);
        color: #fff;
      }

      /* ── 본문 ─────────────────────────────────────────────── */
      main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 1.4vh, 14px);
        padding: 0 clamp(12px, 3vw, 28px) clamp(10px, 2vh, 20px);
      }

      /* 삽화 */
      .stage {
        flex: 3 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2vw, 22px);
      }
      .illus {
        height: 100%;
        max-width: 62%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 22px;
        background: var(--cream-100);
        box-shadow: 0 10px 30px rgba(63, 47, 36, 0.12);
      }
      .listen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .speaker {
        width: clamp(64px, 9vh, 108px);
        height: clamp(64px, 9vh, 108px);
        border-radius: 999px;
        background: var(--coral-500);
        color: #fff;
        font-size: clamp(28px, 4.6vh, 48px);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 20px rgba(232, 75, 42, 0.35);
        transition: transform 0.12s;
      }
      .speaker:active {
        transform: scale(0.94);
      }
      .speaker.playing {
        animation: pulse 0.9s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.07);
        }
      }
      .listen small {
        color: var(--ink-500);
        font-weight: 800;
        font-size: clamp(11px, 1.5vw, 14px);
      }

      /* 놓는 줄 */
      .slots {
        flex: 0 0 auto;
        min-height: clamp(58px, 11vh, 104px);
        border-radius: 22px;
        background: #fff;
        border: 3px dashed var(--peach-200);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1vw, 12px);
        padding: clamp(6px, 1.2vh, 14px);
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .slots.correct {
        background: var(--mint-100);
        border-color: var(--mint-300);
        border-style: solid;
      }
      @keyframes shake {
        25% {
          transform: translateX(-9px);
        }
        50% {
          transform: translateX(9px);
        }
        75% {
          transform: translateX(-5px);
        }
      }
      .blank {
        min-width: clamp(52px, 8vw, 96px);
        height: clamp(40px, 7vh, 66px);
        border-radius: 14px;
        background: var(--cream-100);
        border: 2px dashed var(--peach-200);
      }

      /* 타일 */
      .tray {
        flex: 0 0 auto;
        min-height: clamp(58px, 11vh, 104px);
        border-radius: 22px;
        background: var(--cream-100);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1vw, 12px);
        padding: clamp(6px, 1.2vh, 14px);
      }
      .tile {
        min-height: clamp(40px, 7vh, 66px);
        padding: 0 clamp(10px, 1.8vw, 20px);
        border-radius: 14px;
        background: #fff;
        border: 3px solid var(--peach-300);
        box-shadow: 0 3px 0 var(--peach-200);
        color: var(--ink-700);
        font-weight: 900;
        font-size: clamp(16px, 2.6vh, 30px);
        line-height: 1;
        display: grid;
        place-items: center;
        transition:
          transform 0.1s,
          background 0.15s;
      }
      .tile:active {
        transform: scale(0.94);
      }
      /* 🔴 놓인 카드는 트레이 카드와 **다른 색**이어야 한다 — 둘 다 흰 카드였을 땐
         어디까지 놓았는지가 위치로만 구분됐다. 상태 셋을 색으로 가른다:
         트레이=흰색 / 놓임=복숭아 / 완성=민트. */
      .tile.placed {
        background: var(--peach-200);
        border-color: var(--coral-400);
        box-shadow: 0 3px 0 var(--peach-300);
      }
      .slots.correct .tile.placed {
        background: var(--mint-100);
        border-color: var(--mint-500);
        color: var(--mint-600);
      }
      .tile.used {
        visibility: hidden;
      }
      /* 순서가 아닌 카드를 눌렀을 때 — 그 카드만 흔든다(화면 전체를 흔들지 않는다). */
      .tile.reject {
        animation: shake 0.36s;
        border-color: var(--coral-400);
      }

      /* 상태 */
      .center {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--ink-500);
        font-weight: 800;
        padding: 24px;
      }
      .praise {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(48px, 12vh, 140px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .praise.show {
        opacity: 1;
      }
      .actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2vw, 20px);
      }
      .note {
        color: var(--ink-300);
        font-size: clamp(10px, 1.3vw, 13px);
        font-weight: 700;
      }
      /* 오답 — 붉게 물들이지 않는다. 흔들고 테두리만 진하게(「틀렸다」고 말하지 않기). */
      .slots.wrong {
        animation: shake 0.42s;
        border-color: var(--coral-300);
      }
      .mark {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(80px, 22vh, 220px);
        font-weight: 900;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.18s;
        /* 🔴 삽화 위에 뜬다 — 색만으로는 그림에 묻힌다(코랄 ✗ 가 가을 숲에서 사라졌다). */
        -webkit-text-stroke: 6px #fff;
        paint-order: stroke fill;
        filter: drop-shadow(0 6px 14px rgba(63, 47, 36, 0.45));
      }
      .mark.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title" id="bookTitle">불러오는 중…</span>
      <span class="score" id="score">0 / 0</span>
      <button class="chip" id="langKo" aria-pressed="true">한국어</button>
      <button class="chip" id="langEn" aria-pressed="false">English</button>
      <button class="chip" id="reset">↺ 다시</button>
      <button class="chip" id="shuffle">🎲 다른 책</button>
    </header>

    <main hidden id="game">
      <div class="stage">
        <img class="illus" id="illus" alt="" />
        <div class="listen">
          <button class="speaker" id="speak" aria-label="문장 듣기">🔊</button>
          <small id="listenLabel">눌러서 듣기</small>
        </div>
      </div>
      <div class="slots" id="slots"></div>
      <div class="tray" id="tray"></div>
      <div class="actions">
        <span class="note" id="note"></span>
      </div>
    </main>

    <div class="center" id="status">불러오는 중…</div>
    <div class="praise" id="praise">🎉</div>
    <div class="mark" id="mark"></div>

    <script>
      // ─────────────────────────────────────────────────────────────
      // 데이터
      // ─────────────────────────────────────────────────────────────
      const API = '/api/storybooks';
      const AUDIO_DIR = '/sentence-order-audio';
      const CATEGORIES = ['전래 동화', '세계 명작', '생활동화'];
      const ROUNDS = 5;

      /** 어절 수 범위 — 너무 짧으면 게임이 안 되고 길면 4~7세가 못 든다. */
      const MIN_UNITS = 3;
      const MAX_UNITS = { ko: 7, en: 8 };

      const el = (id) => document.getElementById(id);

      // ── 효과음 — 앱이 이미 쓰는 자산 그대로 ─────────────────────
      // /sounds/game/{correct,incorrect,clear}.mp3 · /sounds/ui/{tap,select,back}.mp3
      // 🔴 같은 요소를 다시 틀려면 currentTime 을 0으로 되돌려야 한다(연타 시 안 나는 것 방지).
      const SFX = {
        place: '/sounds/ui/select.mp3',
        back: '/sounds/ui/back.mp3',
        tap: '/sounds/ui/tap.mp3',
        correct: '/sounds/game/correct.mp3',
        wrong: '/sounds/game/incorrect.mp3',
        clear: '/sounds/game/clear.mp3',
      };
      const sfxPool = {};
      for (const [k, url] of Object.entries(SFX)) {
        const a = new Audio(url);
        a.preload = 'auto';
        a.volume = 0.6;
        sfxPool[k] = a;
      }
      function sfx(name) {
        const a = sfxPool[name];
        if (!a) return;
        try {
          a.currentTime = 0;
          a.play().catch(() => {});
        } catch {
          /* 자동재생 차단 — 첫 탭 이후엔 난다 */
        }
      }
      const clean = (t) =>
        String(t || '')
          .replace(/\*\*/g, '') // 저작 표기용 굵게 마크업
          .replace(/[“”"‘’]/g, '') // 따옴표는 타일이 되면 안 된다
          .replace(/\s+/g, ' ')
          .trim();

      /** 쪽 글 → 문장들. 한국어는 종결부호가 유일한 단서라 그것만 본다. */
      function sentences(text) {
        return clean(text)
          .split(/(?<=[.!?…])\s+/)
          .map((s) => s.trim())
          .filter(Boolean);
      }

      /**
       * 🔴 문장 끝 부호는 떼고 타일을 만든다 — 붙여 두면 마침표가 「내가 마지막」이라고
       * 알려줘서 마지막 한 칸이 공짜가 된다.
       */
      const units = (s) =>
        s
          .replace(/[.!?…]+$/, '')
          .split(/\s+/)
          .filter(Boolean);

      /**
       * 🔴 빌더 — 조건에 안 맞으면 `null`. 억지로 만들지 않는다.
       * 그 쪽에서 어절 수가 맞는 문장 하나를 고른다(제일 긴 것 = 놀 거리가 많은 쪽).
       */
      function buildRounds(book, lang) {
        const out = [];
        for (const p of book.pages || []) {
          const raw = lang === 'ko' ? p.text : p.translations?.en?.text;
          const illus = p.illustrationUrl;
          if (!raw || !illus) continue;
          const cands = sentences(raw).filter((s) => {
            const n = units(s).length;
            return n >= MIN_UNITS && n <= MAX_UNITS[lang];
          });
          if (!cands.length) continue;
          const best = cands.sort((a, b) => units(b).length - units(a).length)[0];
          out.push({ sentence: best, units: units(best), illus, page: p.pageNumber });
        }
        return out.length >= 4 ? out.slice(0, ROUNDS) : null;
      }

      // ─────────────────────────────────────────────────────────────
      // 소리 — 구워 둔 어절/문장 mp3. 없으면 브라우저 음성으로 떨어진다.
      // 🔴 chain 은 ended 로만 잇는다(setTimeout 길이 가정 금지).
      // ─────────────────────────────────────────────────────────────
      let voice = null; // manifest.audio — { "낱말": "a000.mp3" }
      const voicePool = new Map();

      function voiceEl(text) {
        const file = voice?.[text];
        if (!file) return null;
        let a = voicePool.get(text);
        if (!a) {
          a = new Audio(`${AUDIO_DIR}/${file}`);
          a.preload = 'auto';
          voicePool.set(text, a);
        }
        return a;
      }

      /** 낱말 하나 — 타일을 누를 때. 짧아서 chain 이 필요 없다. */
      function sayWord(text) {
        const a = voiceEl(text);
        if (!a) return false;
        try {
          a.currentTime = 0;
          a.play().catch(() => {});
        } catch {
          /* 자동재생 차단 */
        }
        return true;
      }

      let audio = null;
      function play(text, onEnd) {
        const btn = el('speak');
        try {
          speechSynthesis.cancel();
        } catch {
          /* 미지원 브라우저 */
        }
        if (audio) {
          audio.pause();
          audio = null;
        }
        btn.classList.add('playing');
        const done = () => {
          btn.classList.remove('playing');
          onEnd && onEnd();
        };
        const src = voice?.[text];
        if (!src) return browserTts(text, done);
        audio = new Audio(`${AUDIO_DIR}/${src}`);
        audio.onended = done;
        audio.onerror = () => browserTts(text, done);
        audio.play().catch(() => browserTts(text, done));
      }

      /** 음원을 안 구운 문장에서만 — 로봇 목소리라 평소엔 안 쓴다. */
      function browserTts(text, done) {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
          u.rate = 0.92;
          u.onend = done;
          u.onerror = done;
          speechSynthesis.speak(u);
        } catch {
          done();
        }
      }

      // ─────────────────────────────────────────────────────────────
      // 상태
      // ─────────────────────────────────────────────────────────────
      let lang = 'ko';
      let books = [];
      let book = null;
      let rounds = [];
      let idx = 0;
      let score = 0;
      let placed = []; // 놓는 줄 — 트레이 인덱스 배열
      let tray = []; // 섞인 어절
      let locked = false;

      const shuffled = (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        // 우연히 정답 순서면 한 번 더
        return a.every((v, i) => v === arr[i]) && a.length > 1 ? shuffled(arr) : a;
      };

      function render() {
        const r = rounds[idx];
        el('bookTitle').textContent = `${book.title} · ${idx + 1}/${rounds.length}쪽째`;
        el('score').textContent = `${score} / ${rounds.length}`;
        el('illus').src = r.illus;
        el('illus').alt = '';

        const slots = el('slots');
        slots.innerHTML = '';
        for (let i = 0; i < r.units.length; i++) {
          if (placed[i] == null) {
            const b = document.createElement('div');
            b.className = 'blank';
            slots.appendChild(b);
          } else {
            const t = document.createElement('button');
            t.className = 'tile placed';
            t.textContent = tray[placed[i]];
            t.onclick = () => takeBack(i);
            slots.appendChild(t);
          }
        }

        const trayEl = el('tray');
        trayEl.innerHTML = '';
        tray.forEach((w, i) => {
          const t = document.createElement('button');
          t.className = 'tile' + (placed.includes(i) ? ' used' : '');
          t.textContent = w;
          t.onclick = () => place(i);
          trayEl.appendChild(t);
        });

        el('listenLabel').textContent = lang === 'ko' ? '눌러서 듣기' : 'tap to listen';
        el('note').textContent =
          lang === 'ko'
            ? '들은 문장을 순서대로 놓아요 · 순서가 맞아야 올라가요'
            : 'Put the words in order · only the next one goes up';
      }

      function place(i) {
        if (locked || placed.includes(i)) return;
        const slot = placed.indexOf(null);
        if (slot === -1) return;
        // 🔴 **순서가 아닌 카드는 올라가지 않는다.** 틀린 줄을 다 만들게 두었다가 나중에
        //    「틀렸다」고 하면, 아이는 무엇이 틀렸는지 모른 채 통째로 다시 해야 한다.
        //    여기서 막으면 판정이 탭마다 즉시 나고, 올라간 것은 언제나 맞는 것이다.
        if (tray[i] !== rounds[idx].units[slot]) return reject(i);
        placed[slot] = i;
        const done = !placed.includes(null);
        // 🔴 문장을 **완성하는** 카드는 소리를 내지 않는다 — 냈다가는 정답 효과음과
        //    1ms 간격으로 겹친다(실측). 소리는 check() 가 가져간다.
        //    앱 블록 게임이 `pendingLastLetterRef` 로 푼 것과 같은 문제다.
        // 🔴 낱말 음원이 있으면 **그 낱말을 읽어 준다** — 딸깍 효과음보다 그게 배울 거리다.
        if (!done && !sayWord(tray[i])) sfx('place');
        render();
        if (done) check();
      }

      /** 순서가 아닌 카드 — 그 카드만 흔들고 소리를 낸다. 화면은 건드리지 않는다. */
      function reject(i) {
        sfx('wrong');
        const t = [...document.querySelectorAll('#tray .tile')][i];
        if (!t) return;
        t.classList.remove('reject');
        void t.offsetWidth; // 연타해도 애니메이션이 다시 돌게
        t.classList.add('reject');
        setTimeout(() => t.classList.remove('reject'), 380);
      }

      function takeBack(slot) {
        if (locked) return;
        placed[slot] = null;
        sfx('back');
        el('slots').classList.remove('correct');
        render();
      }

      function check() {
        // 🔴 오답 분기가 없다 — place() 가 틀린 카드를 아예 안 올리므로 줄이 다 찼다는 건
        //    곧 맞다는 뜻이다. 「다 채우고 나서 틀렸다」는 상태가 이 게임엔 존재하지 않는다.
        const r = rounds[idx];
        locked = true;
        score++;
        el('score').textContent = `${score} / ${rounds.length}`;
        el('slots').classList.add('correct');
        sfx('correct');
        showMark('✓');
        el('praise').classList.add('show');
        // 🔴 소리 사이 쉼 430ms — 효과음이 문장을 덮지 않게. 문장이 끝나야 다음으로.
        setTimeout(() => {
          hideMark();
          play(r.sentence, () => {
            el('praise').classList.remove('show');
            setTimeout(next, 420);
          });
        }, 430);
      }

      let markTimer = null;
      function showMark(ch) {
        const m = el('mark');
        m.textContent = ch;
        m.style.color = ch === '✓' ? 'var(--mint-500)' : 'var(--coral-400)';
        m.classList.add('show');
        clearTimeout(markTimer);
        markTimer = setTimeout(hideMark, ch === '✓' ? 1200 : 700);
      }
      function hideMark() {
        el('mark').classList.remove('show');
      }

      function next() {
        locked = false;
        el('slots').classList.remove('correct');
        if (idx + 1 >= rounds.length) return finish();
        idx++;
        startRound();
      }

      function startRound() {
        const r = rounds[idx];
        tray = shuffled(r.units);
        placed = new Array(r.units.length).fill(null);
        render();
        setTimeout(() => play(r.sentence), 420);
      }

      function finish() {
        sfx('clear');
        el('game').hidden = true;
        el('status').hidden = false;
        el('status').innerHTML = `<div><div style="font-size:clamp(48px,12vh,120px)">🏅</div>
           <div style="font-size:clamp(18px,3vh,32px);color:var(--ink-700)">${score} / ${rounds.length}</div>
           <div style="margin-top:14px">🎲 다른 책 을 눌러 계속해요</div></div>`;
      }

      // ─────────────────────────────────────────────────────────────
      // 책 고르기
      // ─────────────────────────────────────────────────────────────
      async function loadList() {
        const j = await (await fetch(API)).json();
        books = (j.data || []).filter((b) => CATEGORIES.includes(b.category));
        if (!books.length) throw new Error('책 목록이 비어 있습니다');
      }

      /**
       * 구워 둔 음원이 있으면 그 책으로 시작한다. 없으면(또는 언어를 바꾸면) 무작위 책 +
       * 브라우저 음성. 🔴 라운드도 manifest 에서 그대로 읽는다 — 여기서 다시 뽑으면
       * 규칙이 갈라져 음원 없는 문장이 나온다.
       */
      let manifest = null;
      async function loadManifest() {
        try {
          const m = await (await fetch(`${AUDIO_DIR}/manifest.json`)).json();
          if (m?.rounds?.length && m?.audio) manifest = m;
        } catch {
          /* 음원을 안 구웠으면 그냥 무작위 책으로 */
        }
      }

      function startManifestBook() {
        if (!manifest || lang !== manifest.lang) return false;
        book = { id: manifest.bookId, title: manifest.title };
        rounds = manifest.rounds;
        voice = manifest.audio;
        idx = 0;
        score = 0;
        el('status').hidden = true;
        el('game').hidden = false;
        startRound();
        return true;
      }

      async function pickBook() {
        el('status').hidden = false;
        el('game').hidden = true;
        el('status').textContent = '책 고르는 중…';
        // 🔴 조건에 맞는 책이 나올 때까지 다시 뽑는다 — 못 만들 책은 그냥 건너뛴다.
        for (let tries = 0; tries < 8; tries++) {
          const summary = books[Math.floor(Math.random() * books.length)];
          try {
            const d = (await (await fetch(`${API}/${summary.id}`)).json()).data;
            const r = buildRounds(d, lang);
            if (!r) continue;
            book = d;
            rounds = r;
            voice = null; // 이 책은 음원을 안 구웠다 — 브라우저 음성으로
            idx = 0;
            score = 0;
            el('status').hidden = true;
            el('game').hidden = false;
            startRound();
            return;
          } catch {
            /* 다음 책 */
          }
        }
        el('status').textContent = '이 언어로 만들 수 있는 책을 못 찾았어요';
      }

      function setLang(next) {
        if (lang === next) return;
        lang = next;
        el('langKo').setAttribute('aria-pressed', String(lang === 'ko'));
        el('langEn').setAttribute('aria-pressed', String(lang === 'en'));
        if (startManifestBook()) return;
        // 같은 책으로 언어만 바꿔 본다 — 안 되면 다른 책.
        const r = book && buildRounds(book, lang);
        if (r) {
          rounds = r;
          idx = 0;
          score = 0;
          el('status').hidden = true;
          el('game').hidden = false;
          startRound();
        } else {
          pickBook();
        }
      }

      el('langKo').onclick = () => (sfx('tap'), setLang('ko'));
      el('langEn').onclick = () => (sfx('tap'), setLang('en'));
      el('shuffle').onclick = () => (sfx('tap'), pickBook());
      el('reset').onclick = () => {
        sfx('tap');
        if (!locked) startRound();
      };
      el('speak').onclick = () => play(rounds[idx].sentence);

      Promise.all([loadList(), loadManifest()])
        .then(() => {
          if (!startManifestBook()) return pickBook();
        })
        .catch((e) => {
          el('status').innerHTML = `불러오지 못했습니다 — ${e.message}<br /><br />
             <span style="font-weight:600">프리뷰 서버 주소로 열어야 합니다 (file:// 은 CORS 로 막힙니다)</span>`;
        });
    </script>
  </body>
</html>
