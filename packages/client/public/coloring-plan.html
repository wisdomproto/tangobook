<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎨 색칠공부 도안 작업판</title>
<!--
  낱말마다 세 칸: 원본 삽화 · 프롬프트(복사) · 붙여넣기.
  도안은 외부(GPT 등)에서 만들어 여기 붙인다 — 붙여넣은 그림은 /api/comic-assets/coloring-plan 로 R2 에 저장돼
  다시 열어도 남는다(기획서들과 같은 방식).
  목록 = /coloring-plan-data.json (build-coloring-plan.mjs 가 R2 에서 파생).
-->
<style>
  :root{
    --ink:#2b2b31; --ink-soft:#6b6b76; --line:#e6e3dd;
    --cream:#fdfaf4; --coral:#ff6f61; --mint:#5ec8b6; --ok:#2aa876;
    --warn:#e8b04b; --warn-ink:#a9761a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
       color:var(--ink);background:var(--cream);display:flex;min-height:100vh}
  a{color:inherit}

  /* ── 사이드바 ───────────────────────────────────────── */
  aside{width:236px;flex:0 0 236px;background:#fff;border-right:1.5px solid var(--line);
        height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 0 40px}
  aside h1{font-size:15px;margin:0 18px 14px;font-weight:900;letter-spacing:-.02em}
  .grp{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
       padding:9px 18px;font-size:13.5px;font-weight:700;color:var(--ink-soft);border-left:3px solid transparent}
  .grp:hover{background:#faf8f4}
  .grp.on{color:var(--ink);background:#f4fbf9;border-left-color:var(--mint);font-weight:900}
  .grp .n{float:right;font-size:11.5px;color:#9a9aa4;font-weight:600}
  .done{color:var(--ok);font-weight:800}

  /* ── 본문 ──────────────────────────────────────────── */
  main{flex:1;min-width:0;padding:22px 26px 80px}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .head h2{font-size:21px;margin:0;font-weight:900}
  .head .sub{font-size:13px;color:var(--ink-soft)}
  .bar{position:sticky;top:0;z-index:5;background:var(--cream);padding:10px 0 12px;
       border-bottom:1.5px solid var(--line);margin-bottom:16px}
  .bar input{width:260px;padding:7px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px}
  .bar label{font-size:12.5px;color:var(--ink-soft);margin-left:14px;cursor:pointer}

  section h3{font-size:14px;margin:26px 0 10px;font-weight:900;color:var(--ink-soft)}
  .batchbar{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
  .batch{border:1.5px solid var(--coral);color:var(--coral);background:#fff;white-space:nowrap;
         border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
  .batch:disabled{border-color:var(--line);color:#b0b0b8;cursor:default}
  .batchwords{font-size:12px;color:var(--ink-soft);min-width:0;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}

  .row{display:grid;grid-template-columns:190px 1fr 190px;gap:16px;align-items:start;
       background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row.has{border-color:var(--ok);background:#f6fdfa}
  /* 검사에서 걸린 줄 — 붙인 뒤에도(초록) 흠 표시가 이긴다. */
  .row.bad{border-color:var(--coral);background:#fff7f6}
  .row.warn{border-color:var(--warn);background:#fffdf5}
  .row.color{border-color:#a9b6c9;background:#fafbfd}
  .why{font-size:11.5px;font-weight:800;line-height:1.45;margin-bottom:6px}
  .why.bad{color:var(--coral)} .why.warn{color:var(--warn-ink)} .why.color{color:#5d7391}
  .flagged{border:1.5px solid var(--coral);border-radius:14px;background:#fffaf9;
           padding:13px 14px 1px;margin-bottom:22px}
  .flagged .fh{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .flagged .fh b{font-size:14px;color:var(--coral)}
  .flagged.mild{border-color:#c3ccd9;background:#fbfcfe}
  .flagged.mild .fh b{color:#5d7391}
  .flagged .fh span{font-size:12px;color:var(--ink-soft)}
  .flagged .fh button{margin-left:auto;border:1.5px solid var(--line);background:#fff;
                      border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .flagn{float:right;margin-right:7px;font-size:11px;font-weight:800}
  .flagn.bad{color:var(--coral)} .flagn.warn{color:var(--warn-ink)}
  .slot:focus{outline:2px solid var(--mint);outline-offset:3px;border-radius:12px}
  .word{font-size:16px;font-weight:900;margin-bottom:6px}
  .subj{font-size:12px;color:var(--ink-soft);margin-bottom:8px;line-height:1.5}
  .src img,.dst img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;
                    border:1px solid var(--line);border-radius:10px;display:block}
  pre{white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.55;
      background:#faf8f4;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;
      max-height:150px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;
       font-size:12.5px;font-weight:700;cursor:pointer;margin-top:8px}
  .btn:hover{border-color:var(--coral);color:var(--coral)}
  .drop{border:2px dashed var(--line);border-radius:10px;aspect-ratio:1;display:flex;
        align-items:center;justify-content:center;text-align:center;font-size:11.5px;color:#a5a5ae;
        cursor:pointer;padding:8px;line-height:1.5}
  .drop:hover,.drop.over{border-color:var(--mint);color:var(--mint);background:#f4fbf9}
  .dst .act{display:flex;gap:6px;margin-top:6px}
  .dst .act button{flex:1;font-size:11.5px;padding:5px 0;border:1px solid var(--line);
                   background:#fff;border-radius:7px;cursor:pointer}
  .more{display:block;margin:18px auto;padding:9px 20px;font-size:13px;font-weight:700;
        border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
         color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20}
  .toast.on{opacity:1}
  @media (max-width:900px){
    body{display:block}
    aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1.5px solid var(--line);
          display:flex;overflow-x:auto;padding:10px}
    aside h1{display:none}
    .grp{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
    .grp.on{border-left:0;border-bottom-color:var(--mint)}
    .grp .n{float:none;margin-left:6px}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<aside>
  <h1>🎨 색칠 도안 작업판</h1>
  <div id="nav"></div>
</aside>

<main>
  <div class="head">
    <h2 id="title">불러오는 중…</h2>
    <span class="sub" id="count"></span>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="낱말 검색" />
    <label><input type="checkbox" id="todo" /> 아직 안 붙인 것만</label>
  </div>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var DOC = 'coloring-plan';
  var API = '/api/comic-assets/' + DOC;
  var PAGE = 30;            // 한 번에 그리는 줄 수 — 2,000장을 통째로 그리면 브라우저가 버틴다
  var BATCH = 10;           // 한 프롬프트에 담을 낱말 수
  var data = null, assets = {}, gi = 0, shown = PAGE;
  /**
   * 검사에서 걸린 도안 — `build-coloring-flags.mjs` 가 구운 `{key:{level,why}}`.
   *
   * 🔴 이건 **잰 그때의 사진**이다. 다시 붙여도 저절로 사라지지 않는다 —
   *    고친 뒤엔 `check-coloring-sheets.mjs` → `build-coloring-flags.mjs` 를 다시 돌린다.
   *    (붙여넣은 그림 자체는 그 자리에서 바로 바뀌므로 고쳤는지는 눈으로 보인다.)
   */
  var flags = {};
  var showFlagged = true;
  var showColor = false;
  // 프롬프트는 데이터에 한 벌만 실려 온다 — 낱말만 끼워 넣는다.
  /**
   * 낱말 하나짜리 프롬프트.
   *
   * 🔴 **걸린 도안에는 「지난번엔 이게 틀렸다」를 붙인다.** 규칙을 한 줄 더 늘리는 것보다
   *    실패를 집어 주는 게 세다(숨은그림에서 배운 것). 흠 종류 → 문장은 데이터에 실려 온다.
   */
  function promptLineFor(it) {
    var base = data.promptLine.replace('{{subject}}', it.subject);
    var f = flags[it.key];
    var lines = ((f && f.ids) || [])
      .map(function (id) { return (data.retryLines || {})[id]; })
      .filter(Boolean);
    if (!lines.length) return base;
    return base + '\n\nThis subject is being redrawn. ' + lines.join(' ');
  }
  /**
   * 🔴 붙일 것은 **도안 한 장뿐**이다. 칸별 정답색은 원본 삽화에서 읽어 만든다
   *    (`auto-color.mjs --from=<원본>`) — 색칠본을 따로 받을 이유가 없다.
   */
  function done(it) { return !!assets[it.key]; }

  function batchPrompt(which, list) {
    return data[which]
      .split('{{n}}').join(String(list.length))
      .split('{{subjects}}').join(list.map(function (it, i) {
        return (i + 1) + '. ' + it.subject;
      }).join('\n'));
  }

  var toastT;
  function toast(m) {
    var t = document.getElementById('toast');
    t.textContent = m; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 1400);
  }

  function items(g) {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var todo = document.getElementById('todo').checked;
    var out = [];
    g.sections.forEach(function (s) {
      s.items.forEach(function (it) {
        if (q && it.word.toLowerCase().indexOf(q) < 0 && it.subject.toLowerCase().indexOf(q) < 0) return;
        if (todo && done(it)) return;
        // 🔴 위쪽 흠 목록에 이미 있는 줄은 아래에 또 그리지 않는다 — 같은 칸이 두 개면
        //    한쪽에 붙여도 다른 쪽은 빈 채라 붙였는지 아닌지가 화면마다 달라진다.
        //    「접기」를 누르면 다시 제자리(섹션 흐름)로 돌아온다.
        var f = flags[it.key];
        if (f && (f.level === 'color' ? showColor : showFlagged)) return;
        out.push({ section: s.label, it: it });
      });
    });
    return out;
  }

  /**
   * 그 갈래에서 검사에 걸린 것들 — 사이드바 숫자와 위쪽 목록이 같은 함수를 본다.
   *
   * 🔴 **색이 안 맞는 것(`color`)은 따로 센다.** 그게 339장이라 같이 세면 다시 뽑아야 할
   *    34장이 그 속에 묻힌다. 사이드바 ⚠ 숫자는 **손볼 것만** 가리킨다.
   */
  function flagsOf(g, level) {
    var out = [];
    g.sections.forEach(function (s) {
      s.items.forEach(function (it) {
        var f = flags[it.key];
        if (!f) return;
        if (level === 'color' ? f.level !== 'color' : f.level === 'color') return;
        out.push({ section: s.label, it: it, flag: f });
      });
    });
    if (level !== 'color') out.sort(function (a, b) { return (a.flag.level === 'bad' ? 0 : 1) - (b.flag.level === 'bad' ? 0 : 1); });
    return out;
  }

  function renderNav() {
    var nav = document.getElementById('nav');
    nav.innerHTML = '';
    data.groups.forEach(function (g, i) {
      var n = 0, ok = 0;
      g.sections.forEach(function (s) {
        s.items.forEach(function (it) { n++; if (done(it)) ok++; });
      });
      var f = flagsOf(g);
      var b = document.createElement('button');
      b.className = 'grp' + (i === gi ? ' on' : '');
      b.innerHTML = g.label + '<span class="n' + (ok ? ' done' : '') + '">' +
        (ok ? ok + '/' : '') + n + '</span>' +
        (f.length ? '<span class="flagn ' + (f.some(function (e) { return e.flag.level === 'bad'; })
          ? 'bad' : 'warn') + '">⚠ ' + f.length + '</span>' : '');
      // 🔴 색이 안 맞는 것은 ⚠ 에 안 섞는다 — 손볼 것 하나가 안 보이게 된다.
      if (!f.length && flagsOf(g, 'color').length) b.innerHTML += '<span class="flagn" style="color:#8e9bad">🎨</span>';
      b.onclick = function () { gi = i; shown = PAGE; render(); };
      nav.appendChild(b);
    });
  }

  function makeSlot(it, onChange) {
    var key = it.key;
    var box = document.createElement('div');
    box.className = 'slot';
    var body = document.createElement('div');
    box.appendChild(body);

    function paint() {
      body.innerHTML = '';
      if (assets[key]) {
        var img = document.createElement('img');
        img.src = assets[key] + '?t=' + Date.now();
        body.appendChild(img);
        var act = document.createElement('div');
        act.className = 'act';
        var del = document.createElement('button');
        del.textContent = '🗑 지우기';
        del.onclick = function () {
          fetch(API + '/' + key, { method: 'DELETE' }).then(function () {
            delete assets[key]; paint(); onChange();
          });
        };
        act.appendChild(del); body.appendChild(act);
      } else {
        var d = document.createElement('div');
        d.className = 'drop';
        d.textContent = '여기를 누르고 붙여넣기 (Ctrl+V)' + String.fromCharCode(10) + '또는 파일을 끌어다 놓기';
        body.appendChild(d);
      }
    }
    paint();

    function upload(dataUrl) {
      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key, dataUrl: dataUrl }),
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.success) throw new Error((j && j.error) || '실패');
          assets[key] = (j.data && j.data.url) || dataUrl;
          paint(); onChange(); toast('저장했어요 — ' + it.word);
        })
        .catch(function (e) { toast('저장 실패: ' + e.message); });
    }
    function fromFile(f) {
      if (!f || f.type.indexOf('image/') !== 0) return;
      var fr = new FileReader();
      fr.onload = function () { upload(String(fr.result)); };
      fr.readAsDataURL(f);
    }

    // 🔴 붙여넣기는 **그 칸에 포커스가 있을 때만** 받는다 — 문서 전역으로 받으면 어느 낱말의
    //    어느 칸에 넣을지 알 수 없다. 칸을 한 번 누르고 Ctrl+V 하는 흐름.
    box.tabIndex = 0;
    box.addEventListener('click', function () { box.focus(); });
    box.addEventListener('paste', function (e) {
      var cbItems = (e.clipboardData || {}).items || [];
      for (var i = 0; i < cbItems.length; i++) {
        if (cbItems[i].type.indexOf('image/') === 0) {
          e.preventDefault(); fromFile(cbItems[i].getAsFile()); return;
        }
      }
    });
    box.addEventListener('dragover', function (e) {
      e.preventDefault();
      var d = box.querySelector('.drop'); if (d) d.classList.add('over');
    });
    box.addEventListener('dragleave', function () {
      var d = box.querySelector('.drop'); if (d) d.classList.remove('over');
    });
    box.addEventListener('drop', function (e) {
      e.preventDefault(); fromFile(e.dataTransfer.files[0]);
    });
    return box;
  }

  function batchBar(list) {
    var bar = document.createElement('div');
    bar.className = 'batchbar';
    var btn = document.createElement('button');
    btn.className = 'batch';
    btn.textContent = '📋 이 ' + list.length + '장 묶음 프롬프트';
    btn.onclick = function () {
      navigator.clipboard.writeText(batchPrompt('promptBatchLine', list)).then(function () {
        toast(list.length + '장 묶음을 복사했어요');
      });
    };
    // 🔴 묶음으로 뽑을 땐 **원본 열 장을 같이 붙여야** 자리가 맞는다 — 낱말만 주면 모델이
    //    제 마음대로 구도를 잡고, 그러면 칸 색을 원본에서 못 읽는다(실측 347장).
    var cu = document.createElement('button');
    cu.className = 'batch';
    cu.textContent = '🔗 원본 ' + list.length + '장 주소';
    cu.onclick = function () {
      navigator.clipboard
        .writeText(list.map(function (it) { return it.imageUrl; }).join('\n'))
        .then(function () { toast('원본 ' + list.length + '장 주소를 복사했어요'); });
    };
    bar.appendChild(cu);

    var words = document.createElement('span');
    words.className = 'batchwords';
    words.textContent = list.map(function (it) { return it.word; }).join(', ');
    bar.appendChild(btn); bar.appendChild(words);
    return bar;
  }

  function makeRow(section, it) {
    var row = document.createElement('div');
    var flag = flags[it.key];
    function mark() {
      row.className = 'row' + (done(it) ? ' has' : '') + (flag ? ' ' + flag.level : '');
      renderNav();
    }

    var left = document.createElement('div');
    left.className = 'src';
    left.innerHTML = '<div class="word">' + it.word + '</div>' +
      (flag ? '<div class="why ' + flag.level + '">' +
        (flag.level === 'bad' ? '🔴 ' : '⚠️ ') + flag.why + '</div>' : '') +
      '<div class="subj">' + section + '</div>' +
      '<img loading="lazy" src="' + it.imageUrl + '" alt="' + it.word + '" />';

    var mid = document.createElement('div');
    var pre = document.createElement('pre');
    var text = promptLineFor(it);
    pre.textContent = text;
    var copy = document.createElement('button');
    copy.className = 'btn';
    copy.textContent = '📋 프롬프트 복사';
    copy.onclick = function () {
      navigator.clipboard.writeText(text).then(function () { toast('복사했어요 — ' + it.word); });
    };
    mid.appendChild(pre); mid.appendChild(copy);

    var right = document.createElement('div');
    right.className = 'dst';
    right.appendChild(makeSlot(it, mark));

    mark();
    row.appendChild(left); row.appendChild(mid); row.appendChild(right);
    return row;
  }

  function render() {
    var g = data.groups[gi];
    document.getElementById('title').textContent = g.label;
    renderNav();
    var all = items(g);
    document.getElementById('count').textContent =
      all.length + '장 중 ' + Math.min(shown, all.length) + '장 표시';

    var list = document.getElementById('list');
    list.innerHTML = '';

    // 🔴 걸린 것은 **맨 위에 따로** 모은다 — 2,000줄 안에 흩어 두면 고치러 찾아다녀야 한다.
    //    같은 `makeRow` 라서 여기서 바로 다시 붙일 수 있다.
    function flagBox(rows, opts) {
      if (!rows.length) return;
      var box = document.createElement('div');
      box.className = 'flagged' + (opts.mild ? ' mild' : '');
      var head = document.createElement('div');
      head.className = 'fh';
      head.innerHTML = '<b>' + opts.title(rows) + '</b><span>' + opts.sub(rows) + '</span>';
      var fold = document.createElement('button');
      fold.textContent = opts.open ? '접기' : '펼치기';
      fold.onclick = function () { opts.toggle(); render(); };
      head.appendChild(fold);
      box.appendChild(head);
      if (opts.open) rows.forEach(function (e) { box.appendChild(makeRow(e.section, e.it)); });
      list.appendChild(box);
    }

    var flagged = flagsOf(g);
    flagBox(flagged, {
      open: showFlagged,
      toggle: function () { showFlagged = !showFlagged; },
      title: function (r) { return '⚠️ 다시 봐야 할 도안 ' + r.length + '장'; },
      sub: function (r) {
        var nBad = r.filter(function (e) { return e.flag.level === 'bad'; }).length;
        return '다시 뽑을 것 ' + nBad + ' · 살펴볼 것 ' + (r.length - nBad);
      },
    });
    flagBox(flagsOf(g, 'color'), {
      open: showColor, mild: true,
      toggle: function () { showColor = !showColor; },
      title: function (r) { return '🎨 원본에서 색을 못 읽는 도안 ' + r.length + '장'; },
      sub: function () { return '도안이 원본과 다른 것을 그렸거나 크기가 많이 달라, 칸 색이 배경에서 읽힌다'; },
    });

    var lastSection = null, sec = null;
    all.slice(0, shown).forEach(function (e, i) {
      // 🔴 묶음 버튼은 **10줄마다** 붙는다. 상단에 하나만 두면 아래로 내려간 뒤엔 손이 안 닿는다.
      //    각 버튼은 바로 아래 10줄만 담으므로, 받은 그림을 그 자리에서 순서대로 붙이면 된다.
      if (i % BATCH === 0) {
        list.appendChild(batchBar(all.slice(i, i + BATCH).map(function (x) { return x.it; })));
        lastSection = null; // 버튼 뒤에는 섹션 제목을 다시 세운다(안 그러면 줄이 버튼 위로 붙는다)
      }
      if (e.section !== lastSection) {
        lastSection = e.section;
        sec = document.createElement('section');
        var h = document.createElement('h3');
        h.textContent = e.section;
        sec.appendChild(h);
        list.appendChild(sec);
      }
      sec.appendChild(makeRow(e.section, e.it));
    });
    if (all.length > shown) {
      var more = document.createElement('button');
      more.className = 'more';
      more.textContent = '더 보기 (' + (all.length - shown) + '장 남음)';
      more.onclick = function () { shown += PAGE; render(); };
      list.appendChild(more);
    }
  }

  document.getElementById('q').addEventListener('input', function () { shown = PAGE; render(); });
  document.getElementById('todo').addEventListener('change', function () { shown = PAGE; render(); });

  Promise.all([
    fetch('/coloring-plan-data.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }),
    fetch(API).then(function (r) { return r.json(); }).catch(function () { return {}; }),
    fetch('/coloring-plan-flags.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).catch(function () { return {}; }),
  ]).then(function (res) {
    data = res[0];
    assets = (res[1] && res[1].data) || {};
    flags = res[2] || {};
    render();
  }).catch(function (e) {
    document.getElementById('title').textContent = '목록을 못 불러왔어요: ' + e.message;
  });
})();
</script>
</body>
</html>
