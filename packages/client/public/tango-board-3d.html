/* ----------------------------------------------------------- 자체 점검 */
function selfTest(){
  var bad = [];
  function eq(got, want, label){ if (got !== want) bad.push(label + ': ' + got + ' != ' + want); }
  // 파서가 살아 있는가 — 가로조합 / 세로조합 / 받침
  eq(parseFree([{ch:'ㄱ',x:0,y:0,w:3,h:3},{ch:'ㅏ',x:3,y:0,w:2,h:5}]).join(''), '가', '가');
  eq(parseFree([{ch:'ㄱ',x:0,y:0,w:3,h:3},{ch:'ㅗ',x:0,y:3,w:5,h:2}]).join(''), '고', '고');
  eq(parseFree([{ch:'ㄱ',x:0,y:0,w:3,h:3},{ch:'ㅏ',x:3,y:0,w:2,h:5},
                {ch:'ㅇ',x:0,y:5,w:3,h:3}]).join(''), '강', '강');
  // 회전 규격 — 90도면 가로세로가 바뀐다
  var v = { def: catalogOf('ㅓ'), rot: 90 };
  eq(spanOf(v).w + 'x' + spanOf(v).h, '5x2', 'ㅓ 90도 span');
  eq(catalogOf('ㅓ').rots[90], 'ㅗ', 'ㅓ 90도 = ㅗ');
  // 모든 블록이 실제로 획을 갖는가 (빈 메시면 화면에서 사라진다)
  CATALOG.forEach(function(d){
    if (!buildBlockMesh(d).length) bad.push('획이 없는 블록: ' + d.base);
  });
  if (bad.length) console.warn('[tango-board-3d] self-test\n' + bad.join('\n'));
  else console.log('[tango-board-3d] self-test ok');
  return bad;
}

/* ---------------------------------------------------------------- 시작 */
/** 보드는 원래 모델 좌표를 유지하고, 블록은 자기 중심을 원점으로 옮긴다
 *  (블록은 배치 변환이 위치를 정하므로 원래 좌표를 들고 있으면 두 번 밀린다). */
/* 오른쪽 조작판 — 새 제품은 태블릿이 조작을 맡으므로 없앤다.
   본체 오른쪽 끝이 x≈405, 조작판 왼쪽이 x≈420 이라 그 사이에서 가른다. */
var PANEL_CUT_X = 412;
var showPanel = false;

function decodeMesh(part, keepOrigin){
  var bin = atob(part.b64), n = bin.length, bytes = new Uint8Array(n);
  for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
  var q = new Int16Array(bytes.buffer);
  var f = new Float32Array(q.length);
  var c = keepOrigin ? part.centre : [0, 0, 0], s = part.scale;
  for (var j = 0; j < q.length; j += 3){
    f[j]   = q[j]  / s + c[0];
    f[j+1] = q[j+1]/ s + c[1];
    f[j+2] = q[j+2]/ s + c[2];
  }
  return f;
}

/* 메시는 보통 옆 파일에서 받지만, 한 파일로 묶어 두면 그걸 쓴다.
   file:// 로 열면 fetch 가 막히므로 단일 파일 배포본이 그 경우를 덮는다. */
var inlineMesh = document.getElementById('meshData');
(inlineMesh
  ? Promise.resolve(JSON.parse(inlineMesh.textContent))
  : fetch(MESH_URL).then(function(r){
      if (!r.ok) throw new Error('mesh ' + r.status);
      return r.json();
    }))
  .then(function(data){
    ['board', 'frame'].forEach(function(k){
      if (data[k]) meshes[k] = makeMesh(decodeMesh(data[k], true));
    });

    // 격자는 판이 움푹 팬 놀이 영역에만 앉는다 (메시에서 재서 저장해 둔 값).
    var meta = meshMeta = data.meta;
    PITCH = meta.pitch;
    boardTop = meta.playZ;
    GRID_W = meta.cols;
    GRID_H = meta.rows;
    boardOrigin.x = meta.playX;
    boardOrigin.y = meta.playY + GRID_H*PITCH;      // 격자 (0,0) = 놀이 영역 위쪽 모서리
    cam.tx = meta.playX + GRID_W*PITCH/2;
    cam.ty = meta.playY + GRID_H*PITCH/2;


    /* 블록은 실물 8mm 파트 메시를 그대로 쓴다 — 모따기·라운딩이 살아 있다.
       획을 압출한 것은 그 자모가 데이터에 없을 때의 폴백이자, 카메라 인식
       템플릿의 근거로 남는다(인식은 윤곽만 보므로 둘이 같은 형상이면 된다). */
    var realBlocks = 0;
    CATALOG.forEach(function(def){
      var key = 'blk_' + def.base;
      if (data[key]){ meshes[key] = makeMesh(decodeMesh(data[key], false)); realBlocks++; }
      else meshes[key] = makeMesh(buildBlockMesh(def));
    });
    console.log('[tango-board-3d] 실물 블록 ' + realBlocks + '/' + CATALOG.length);
    buildTray();
    resize();
    fitCamera();
    selfTest();
    invalidate();
    document.getElementById('loading').classList.add('gone');
    nextWord(false);           // 빈 판으로 시작
  })
  .catch(function(e){
    var msg = location.protocol === 'file:'
      ? '파일을 직접 열면 보드 데이터를 읽을 수 없습니다. 서버로 열거나 단일 파일 배포본을 쓰세요.'
      : '보드 데이터를 불러오지 못했습니다 — ' + e.message;
    document.getElementById('loadMsg').textContent = msg;
    console.error(e);
  });

new ResizeObserver(function(){
  resize();
  if (!camTouched && GRID_W) fitCamera();
  invalidate();
}).observe(document.getElementById('stage'));
/** 인식 결과를 패널에 그린다 — 정답이 있으니 맞았는지까지 바로 보인다. */
function onRecoResult(){
  var el = document.getElementById('camReco');
  if (!el || !reco.result) return;
  var r = reco.result, sc = reco.score;
  if (!sc.blocks){ el.innerHTML = '<span class="dim">판에 블록이 없습니다</span>'; return; }
  var ok = sc.wordOk;
  var det = camSim.detect
    ? (camSim.detected
        ? '<span class="ok">판 검출 ✓</span> <span class="dim">모서리 오차 ' +
          (camSim.cornerErr * camSim.W).toFixed(0) + 'px</span><br>'
        : '<span class="no">판이 화면에 다 안 들어옵니다</span> <span class="dim">정답 좌표로 대체</span><br>')
    : '';
  var rf = camSim.refineInfo
    ? '<span class="dim">격자 주기 ' + camSim.refineInfo.P.join(' / ') +
      ' (목표 ' + CELL + ')</span><br>'
    : '';
  el.innerHTML = det + rf +
    '<span class="big ' + (ok ? 'ok' : 'no') + '">' + (r.word || '—') + '</span>' +
    ' <span class="dim">정답 ' + sc.truthWord + '</span><br>' +
    '<span class="' + (sc.rel === sc.blocks ? 'ok' : 'no') + '">블록 ' +
    sc.rel + '/' + sc.blocks + '</span>' +
    (sc.rel > sc.hit ? ' <span class="dim">(원점 ' + sc.off.join(',') + ' 밀림)</span>' : '') +
    ' <span class="dim">덩어리 ' + r.comps + ' · ' + reco.ms.toFixed(0) + 'ms</span>';
}

/* =====================================================================
 * 채점 하네스 — 거치 조건을 통째로 쓸어 「어디서 되는가」를 한 장으로 만든다.
 *
 * 손으로 몇 점씩 재면 표본이 편향된다(그래서 30° 퇴행을 우연히 발견했다).
 * 정답이 있으니 채점이 공짜라, 조합을 전부 돌려 보는 편이 싸고 정직하다.
 * ===================================================================== */
var SWEEP = {
  tilt:    [20, 25, 30, 35, 40, 45, 50, 55, 60, 70],
  height:  [250, 300, 350, 400, 450, 500],
  azimuth: [-30, -15, 0, 15, 30]
};

/** 스윕에 쓸 판 배치를 만든다 — 낱말이 성립해야 낱말 지표가 뜻을 갖는다. */
function sweepSetup(){
  clearBoard();
  ['ㄱ', 'ㅓ', 'ㅈ', 'ㅣ'].forEach(function(ch){ addBlock(ch); });
  var j = placed.filter(function(p){ return p.def.base === 'ㅓ'; })[0];
  if (j){ rotate(j); rotate(j); }                 // ㅓ -> ㅗ -> ㅏ
  function put(base, gx, gy){
    var t = placed.filter(function(p){ return p.def.base === base; })[0];
    if (t){ t.gx = gx; t.gy = gy; }
  }
  put('ㄱ', 2, 4); put('ㅓ', 5, 4); put('ㅈ', 8, 4); put('ㅣ', 11, 4);
  stopAll();
  return readBoard();
}

/** 조합 하나를 재고 결과를 돌려준다. */
function sweepOne(tilt, height, az){
  camSim.tilt = tilt; camSim.padH = height; camSim.azimuth = az;
  draw();
  var sc = reco.score || {};
  return {
    tilt: tilt, height: height, az: az,
    detected: !!camSim.detected,
    word: (reco.result && reco.result.word) || '',
    ok: !!sc.wordOk,
    rel: sc.rel || 0,
    blocks: sc.blocks || 0
  };
}

/** 전 조합 스윕. 브라우저가 굳지 않게 나눠 돌리고, 끝나면 결과 배열을 넘긴다. */
function runSweep(onProgress, onDone){
  var truth = sweepSetup();
  var jobs = [];
  SWEEP.azimuth.forEach(function(a){
    SWEEP.tilt.forEach(function(t){
      SWEEP.height.forEach(function(h){ jobs.push([t, h, a]); });
    });
  });
  var results = [], i = 0;
  var saved = { tilt:camSim.tilt, padH:camSim.padH, azimuth:camSim.azimuth };
  (function chunk(){
    var t0 = performance.now();
    while (i < jobs.length && performance.now() - t0 < 60){
      results.push(sweepOne(jobs[i][0], jobs[i][1], jobs[i][2]));
      i++;
    }
    if (onProgress) onProgress(i, jobs.length);
    if (i < jobs.length){ setTimeout(chunk, 0); return; }
    camSim.tilt = saved.tilt; camSim.padH = saved.padH; camSim.azimuth = saved.azimuth;
    draw();
    if (onDone) onDone({ truth: truth, results: results });
  })();
}

/** 히트맵 — 방위각마다 경사각 x 높이 격자를 하나씩. */
function drawSweep(canvas, data){
  var g = canvas.getContext('2d');
  var T = SWEEP.tilt, Hh = SWEEP.height, A = SWEEP.azimuth;
  var cell = 26, padL = 42, padT = 30, gapX = 22;
  var gw = Hh.length*cell, gh = T.length*cell;
  canvas.width = (padL + gw + gapX) * A.length + 20;
  canvas.height = padT + gh + 46;
  var css = getComputedStyle(document.documentElement);
  g.fillStyle = '#151d1a';
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.font = '10px "IBM Plex Mono", monospace';
  g.textBaseline = 'middle';

  A.forEach(function(a, ai){
    var ox = 10 + ai*(padL + gw + gapX);
    g.fillStyle = '#cfe0d9';
    g.textAlign = 'left';
    g.fillText('방위각 ' + a + '°', ox, 12);
    T.forEach(function(t, ti){
      g.fillStyle = '#7e968d';
      g.textAlign = 'right';
      g.fillText(t + '°', ox + padL - 6, padT + ti*cell + cell/2);
      Hh.forEach(function(h, hi){
        var r = data.results.filter(function(x){
          return x.tilt === t && x.height === h && x.az === a;
        })[0];
        var x = ox + padL + hi*cell, y = padT + ti*cell;
        var col = '#3a2b28';
        if (r){
          if (r.ok) col = r.rel === r.blocks ? '#2f9e77' : '#5fbf6a';
          else if (r.rel >= r.blocks/2) col = '#b8892f';
          else if (r.detected) col = '#8a3f34';
          else col = '#3a2b28';
        }
        g.fillStyle = col;
        g.fillRect(x + 1, y + 1, cell - 2, cell - 2);
      });
    });
    g.fillStyle = '#7e968d';
    g.textAlign = 'center';
    Hh.forEach(function(h, hi){
      g.save();
      g.translate(ox + padL + hi*cell + cell/2, padT + gh + 14);
      g.fillText(String(h), 0, 0);
      g.restore();
    });
  });
  g.fillStyle = '#7e968d';
  g.textAlign = 'left';
  var okN = data.results.filter(function(r){ return r.ok; }).length;
  g.fillText('가로 = 높이(mm) · 세로 = 경사각 · 초록 = 낱말 정답  (' +
             okN + '/' + data.results.length + ')', 10, canvas.height - 12);
}

/* ---- 카메라 시뮬레이션 조작 ---- */
document.getElementById('panelChk').addEventListener('change', function(e){
  showPanel = e.target.checked;
  draw();
});

(function(){
  var panel = document.getElementById('camPanel');
  var btn = document.getElementById('camToggle');
  var note = document.getElementById('camNote');

  function refresh(){
    document.getElementById('camTiltV').textContent = camSim.tilt + '°';
    document.getElementById('camHeightV').textContent = camSim.padH + 'mm';
    var standEl = document.getElementById('camStandV');
    if (standEl) standEl.textContent = Math.round(rigGeometry().slotY) + 'mm';
    var overEl = document.getElementById('camOverV');
    if (overEl) overEl.textContent = camSim.overhang + 'mm';
    document.getElementById('camAzV').textContent = camSim.azimuth + '°';
    var padEl = document.getElementById('camPadV');
    if (padEl) padEl.textContent = (camSim.padTilt || 80) + '°';
    // 이 조건에서 격자 한 칸과 획이 몇 픽셀로 보이는지 — 인식 가능성의 첫 눈금
    var s = Math.sin(camSim.tilt * Math.PI/180);
    var camZ = rigGeometry().eye[2] - boardTop;
    var pxPerMm = camSim.W / (2 * (camZ/s) * Math.tan(camSim.fov*Math.PI/360));
    var cell = PITCH * pxPerMm * s, stroke = 13 * pxPerMm * s;
    var thin = stroke < 12;
    note.className = 'cam-note' + (thin || camSim.visible === false ? ' warn' : '');
    var fill = camSim.corners
      ? Math.round(100 * Math.abs(camSim.corners[1][0] - camSim.corners[0][0]))
      : null;
    var stand = camSim.standH != null
      ? '<br>받침 높이 <b>' + Math.max(0, camSim.standH).toFixed(0) + 'mm</b>' +
        ' <span style="opacity:.7">(태블릿 ' + TABLET.h + 'mm 기준)</span>'
      : '';
    note.innerHTML =
      '격자 <b>' + cell.toFixed(0) + 'px</b> · 획 <b>' + stroke.toFixed(0) + 'px</b>' +
      (fill != null ? ' · 판이 화면 폭의 <b>' + fill + '%</b>' : '') +
      (camSim.visible === false ? '<br>판이 화면 밖으로 나갑니다'
       : thin ? '<br>획이 얇아 자모가 뭉갤 수 있습니다' : '') + stand;
    invalidate();
  }
  document.getElementById('camDetect').addEventListener('change', function(e){
    camSim.detect = e.target.checked;
    refresh();
  });
  camSim.detect = document.getElementById('camDetect').checked;
  document.getElementById('camRefine').addEventListener('change', function(e){
    camSim.refine = e.target.checked;
    refresh();
  });
  camSim.refine = document.getElementById('camRefine').checked;
  document.getElementById('camRig').addEventListener('change', function(e){
    camSim.rig = e.target.checked;
    refresh();
  });
  camSim.rig = document.getElementById('camRig').checked;
  var sweepBtn = document.getElementById('camSweep');
  sweepBtn.addEventListener('click', function(){
    if (!camSim.on) return;
    sweepBtn.disabled = true;
    runSweep(function(done, total){
      sweepBtn.textContent = '스윕 ' + done + '/' + total;
    }, function(data){
      sweepBtn.disabled = false;
      sweepBtn.textContent = '전 조건 스윕';
      drawSweep(document.getElementById('sweepCanvas'), data);
      document.getElementById('sweepBox').hidden = false;
      window.__sweep = data;
    });
  });
  document.getElementById('sweepClose').addEventListener('click', function(){
    document.getElementById('sweepBox').hidden = true;
  });

  btn.addEventListener('click', function(){
    camSim.on = !camSim.on;
    btn.classList.toggle('on', camSim.on);
    panel.hidden = !camSim.on;
    if (camSim.on) refresh(); else invalidate();
  });
  [['camTilt','tilt'], ['camHeight','padH'], ['camAz','azimuth'],
   ['camPad','padTilt'], ['camStand','standY'], ['camOver','overhang']].forEach(function(pair){
    document.getElementById(pair[0]).addEventListener('input', function(e){
      camSim[pair[1]] = +e.target.value;
      refresh();
    });
  });
})();

document.getElementById('speak').addEventListener('click', speak);
document.getElementById('clear').addEventListener('click', clearBoard);
document.getElementById('nextWord').addEventListener('click', function(){
  clearBoard();
  nextWord();
});
</script>
