    <!--
      내부 트래픽 제외 → GA4 비활성 + 픽셀 미발화.

      🔴 예전엔 조건이 「localStorage tb_internal=1」 하나뿐이었다. 그건 **브라우저마다 손으로
         켜야** 해서, 시크릿창·새 기기·자동화 브라우저는 전부 새 Direct 사용자로 잡혔다.
         2026-08-13 실측: 7일 Direct 75%, 그리고 `/library/phonics/chinese/zh-l4-u02`(개발 중인
         미완성 화면)에 **1명이 46뷰** — 사용자가 갈 수 없는 URL 이니 전부 우리 개발·검증 트래픽이다.
      조건 셋:
        ① navigator.webdriver — puppeteer·CDP 등 **자동화 브라우저는 자동 제외**(사람 브라우저는 false).
           손이 갈 일이 없어서 이게 제일 확실하다.
        ② ?__tb=internal 로 한 번 열면 그 브라우저는 계속 제외(?__tb=external 로 해제).
        ③ 기존 localStorage 플래그(개발자 이메일 로그인 시 AnalyticsControl 이 세팅).
      ⚠️ 이건 **클라이언트 측 제외**라 우리 브라우저에서만 듣는다. 사무실·집 IP 를 GA4
         「내부 트래픽 정의」에 넣는 서버 측 필터가 있어야 완전하다.
    -->
    <script>
      window.__tbInternal = (function () {
        try {
          var q = new URLSearchParams(location.search).get('__tb');
          if (q === 'internal') localStorage.setItem('tb_internal', '1');
          else if (q === 'external') localStorage.removeItem('tb_internal');
          if (navigator.webdriver === true) return true;
          return localStorage.getItem('tb_internal') === '1';
        } catch (e) {
          return navigator.webdriver === true;
        }
      })();
      if (window.__tbInternal) window['ga-disable-G-XENG7XW959'] = true;
    </script>

    <!--
      Google Analytics 4 (gtag.js) — 향상된 측정으로 SPA 라우트 이동 자동 추적.
      🔴 **첫 페인트 뒤에 붙인다**(2026-08-04 실측). 예전엔 head 에서 바로 받아
         gtag 104KB 대의 서드파티가 앱 번들보다 **먼저 회선을 썼고**, 4G·보급형 폰에서
         첫 글자가 11.4초에 나왔다. `gtag()` 는 dataLayer 에 밀어 넣기만 하므로
         스크립트가 늦게 와도 **호출은 큐에 쌓였다가 그대로 전송된다** — 측정 손실 없음.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-XENG7XW959');
      addEventListener('load', () => {
        const g = document.createElement('script');
        g.async = true;
        g.src = 'https://www.googletagmanager.com/gtag/js?id=G-XENG7XW959';
        document.head.appendChild(g);
      });
    </script>

    <!-- Meta Pixel (tangobook dataset) — 초기 PageView. SPA 라우트 이동은 MetaPixelTracker 가 재발화.
         🔴 2026-08-13 에 옛 `tangonote2`(1580220763664630)에서 갈아탔다. 그 픽셀은 **광고 계정과 다른
            비즈니스 포트폴리오**에 있어서 광고 세트의 데이터 세트 목록에 아예 뜨지 않았다(전환 최적화
            불가). 소유권을 옮기는 대신 광고 계정이 있는 `tangobook_korea` 안에서 새로 만들었다 —
            옛 픽셀의 28일 3,500건은 대부분 우리 내부 트래픽이었고 맞춤 타겟도 만든 적이 없어 버릴 게
            없었다. 새 픽셀도 반드시 광고 계정과 **같은 비즈니스**에 있어야 한다. -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = '2.0';
        n.queue = [];
        // 🔴 스크립트 자체는 **load 이후**에 받는다 — `fbq()` 는 큐에 쌓이므로 유실 없음.
        //    head 에서 바로 받던 시절 `fbevents.js` 104KB 가 앱 번들 앞을 막았다.
        addEventListener('load', function () {
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        });
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      if (!window.__tbInternal) {
        fbq('init', '912431388591231');
        fbq('track', 'PageView');
      }
    </script>

    <!--
      폰트 — 🔴 **`index.css` 의 `@import` 에서 여기로 옮겼다**(2026-08-04).
      `@import` 는 CSS 가 도착한 *뒤에야* 발견되므로 요청이 한 단계 뒤로 밀리고,
      그동안 렌더가 멈춘다. head 의 `<link>` 는 프리로드 스캐너가 즉시 집어 간다.
      🔴 한국어 본문 2종만 블로킹으로 두고, **zh/th·표지용 5종(160KB)은 비블로킹**이다 —
         첫 화면은 한국어인데 중국어 글리프를 기다리고 있었다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      🔴 **`-dynamic-subset` 이다 — 통짜 파일을 쓰면 폰트 하나가 페이지의 절반이 된다**(2026-08-27).
         통짜 `PretendardVariable.woff2` 는 **2,057,688 bytes**(직접 `content-length` 확인)로,
         첫 화면 전송량 3,895KB 의 **53%** 였다. 다음으로 큰 게 우리 JS 264KB 다.
         PSI 모바일 실측 FCP **17.1s** · LCP **20.7s**(데스크톱은 2.6s·3.4s) — 3,895KB 를
         느린 4G 1.6Mbps 로 나누면 19.5초라 숫자가 그대로 맞아떨어진다.
      🔴 subset 은 `unicode-range` 로 92 조각이고 **브라우저가 그 페이지에 쓰인 글자의
         조각만** 받는다. 홈 기준 실측 **24조각 / 598KB → 1,412KB 절감**(전체의 36%).
         "몇 조각이면 된다"가 아니다 — 한국어라 음절 블록을 많이 쓴다. 세어 보고 쓴 숫자다.
      ⚠️ 대가는 `font-display: swap`(subset 에 이미 박혀 있다) — 폴백으로 먼저 그렸다가
         바뀌는 깜빡임이 생긴다. 2026-08-04 에 블로킹을 고른 건 그걸 피하려던 것이고,
         **속도를 우선하기로 사용자가 정해서** 뒤집었다. 되돌리려면 이 URL 에서 `-dynamic-subset`
         만 떼면 된다(그러면 2MB 가 돌아온다).
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <!--
      🔴 **NanumSquareRound 는 여기서 `<link>` 로 받지 않는다**(2026-08-27).
         jsdelivr 의 그 CSS 는 ①렌더를 758ms 막고 ②`font-display` 가 없어서(=auto)
         헤딩 글자가 폰트를 기다리는 동안 **아예 안 보이고** ③웨이트 4종(L·R·B·EB)을
         선언해 실측에서 **B+EB 475KB** 를 받았고 ④src 첫 줄이 `format()` 없는
         **1.4MB `.eot`** 이다. 우리가 쓰는 건 700~900 뿐이라(black 165 · extrabold 20 ·
         bold 4) EB 한 장이면 된다 → `index.css` 에서 직접 선언한다.
    -->
    <!--
      🔴 **첫 페인트가 끝난 뒤에 받는다**(2026-08-04). `media="print"` 는 렌더를 막지는 않지만
         브라우저가 곧바로 받으러 간다 — 4G 실측에서 이 둘(101KB + 61KB)이 FCP 전에 내려와
         정작 필요한 우리 CSS·HTML 의 대역폭을 가져갔다. 중국어·태국어 글리프와 표지용
         장식 폰트라, **한국어 첫 화면에는 한 글자도 안 쓴다**.
    -->
    <script>
      addEventListener('load', function () {
        [
          'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap',
          'https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@700;800&family=ZCOOL+KuaiLe&family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+Thai:wght@700;900&display=swap',
        ].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          document.head.appendChild(l);
        });
      });
    </script>
