<style>
*{box-sizing:border-box}body{margin:0;color:#353b33;background:#efeee8;font-family:'Malgun Gothic',system-ui,sans-serif}button,a,input{font:inherit}button{cursor:pointer}header{position:absolute;z-index:2;top:26px;left:32px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:3px;color:#71776a}h1{font-family:Georgia,'Malgun Gothic',serif;font-weight:400;font-size:30px;margin:12px 0 9px;letter-spacing:-1.5px}header p{font-size:12px;color:#7c8177}#stage{width:100vw;height:100vh;display:block}aside{position:absolute;z-index:3;right:24px;top:24px;bottom:24px;width:285px;display:flex;flex-direction:column;background:rgba(255,255,252,.94);border:1px solid #fff;border-radius:18px;padding:24px;box-shadow:0 12px 45px #2730220c;backdrop-filter:blur(14px)}.label{font-size:10px;letter-spacing:2px;color:#909788;margin-bottom:12px}h2{font-size:17px;font-weight:500;margin:0 0 6px}.meta{font-size:12px;color:#8b9185;margin:0 0 22px}.views{display:grid;grid-template-columns:1fr 1fr;gap:7px}.views button{padding:10px 5px;background:#f3f4ee;border:1px solid transparent;border-radius:8px;color:#62695c;font-size:12px}.views button.active{background:#66765b;color:white}.divider{border-top:1px solid #e9ebe3;margin:22px 0}.toggle{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:12px 0;color:#6d7564}input{accent-color:#66765b}.assetlist{overflow:auto;min-height:90px;flex:1;margin:10px -7px 0}.assetlist button{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:10px 7px;font-size:12px;color:#62695c}.assetlist button:hover,.assetlist button.selected{background:#eef1e7}.dot{width:8px;height:8px;border-radius:50%;background:#b7bca5}.selected .dot{background:#637f4c}.detail{background:#f3f4ef;border-radius:10px;padding:12px;margin-top:12px;font-size:11px;line-height:1.8;color:#7c8572;min-height:64px}.links{display:flex;gap:10px;margin-top:16px;font-size:11px}.links a{color:#687a5b;text-decoration:none;border-bottom:1px solid #c9d0be;padding-bottom:3px}.hint{position:absolute;bottom:30px;left:32px;font-size:11px;color:#81877b;z-index:2}.badge{position:absolute;left:32px;bottom:64px;border:1px solid #d5dacb;background:#ffffffa0;padding:7px 12px;border-radius:20px;font-size:10px;color:#7a836d;z-index:2}#status{position:absolute;top:50%;left:calc(50% - 140px);font-size:14px;color:#7a836d;z-index:4}#status.error{color:#a84337}canvas{outline:none}@media(max-width:700px){header{left:18px;top:18px}h1{font-size:23px}aside{top:auto;bottom:12px;left:12px;right:12px;width:auto;height:235px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}aside .divider,aside .meta,aside>.label,.links,.detail{display:none}.assetlist{grid-column:2;grid-row:1/5;margin:0}.views{grid-column:1}.toggle{margin:1px 0}.hint{bottom:260px;left:18px}.badge{display:none}}

<body><header><div class="eyebrow">VIRTUAL FAMILY · HOME STUDY 01</div><h1>햇살이 머무는 집</h1><p>정돈된 공간에서 시작하는 아이의 하루</p></header>
<canvas id="stage"></canvas><div id="status">집과 가구를 불러오는 중…</div>
<aside><div class="label">THE SPACE</div><h2>거실 · 주방 · 독서 공간</h2><p class="meta">9 × 7 m &nbsp; / &nbsp; 층고 2.9 m</p><div class="views">
<button data-view="overview" class="active">집 전체</button><button data-view="top">평면 보기</button><button data-view="reading">독서 공간</button><button data-view="living">거실</button></div>
<div class="divider"></div><label class="toggle">거실 옆벽 표시<input id="walls" type="checkbox"></label><label class="toggle">가구만 보기<input id="furniture" type="checkbox"></label>
<div class="divider"></div><div class="label">FURNITURE & OBJECTS</div><div class="assetlist" id="assets"></div><div class="detail" id="detail">가구를 클릭하면 이름과 크기를 확인할 수 있습니다.</div>
<div class="links"><a href="family-home-v1.blend" download>Blender 원본 ↓</a><a href="family-home-v1.glb" download>3D 모델 ↓</a></div></aside>
<div class="badge">ORIGINAL 3D SET · 엄마 없는 촬영 공간</div><div class="hint">드래그로 회전 · 휠로 확대 · 오른쪽 드래그로 이동</div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#stage'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
const scene=new THREE.Scene();scene.background=new THREE.Color('#efeee8');
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.05,100);camera.position.set(12,12,15);
const controls=new OrbitControls(camera,canvas);controls.target.set(.6,.4,0);controls.enableDamping=true;controls.minDistance=1.2;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xfff8e9,0x9da690,1.5));
const sun=new THREE.DirectionalLight(0xfff5de,2.6);sun.position.set(-6,10,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:.1,far:30});sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.8);fill.position.set(4,7,8);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#efeee8',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.235;ground.receiveShadow=true;scene.add(ground);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),groups=new Map();let model,manifest,selected,outline;
const views={overview:{pos:[12,12,15],target:[.5,.25,0]},top:{pos:[0,20,.001],target:[0,0,0]},reading:{pos:[-3.3,2.3,5.6],target:[-1.6,.6,.8]},living:{pos:[-1.3,3.5,6.2],target:[2.5,.5,.5]}};
function view(key){const v=views[key];camera.position.fromArray(v.pos);controls.target.fromArray(v.target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>view(b.dataset.view)));
function visibility(){const furniture=document.querySelector('#furniture').checked,walls=document.querySelector('#walls').checked;groups.forEach((o,id)=>{const architecture=id.startsWith('architecture-');o.visible=architecture?(!furniture&&(id!=='architecture-east'||walls)):true;});if(outline&&selected)outline.visible=selected.visible;}
document.querySelector('#walls').addEventListener('change',visibility);document.querySelector('#furniture').addEventListener('change',visibility);
function select(id){const o=groups.get(id),a=manifest.assets.find(a=>a.id===id);if(!o||!a)return;selected=o;if(outline){scene.remove(outline);outline.geometry.dispose();outline.material.dispose();}outline=new THREE.BoxHelper(o,0x9aa880);outline.material.transparent=true;outline.material.opacity=.65;scene.add(outline);document.querySelector('#detail').textContent=`${a.title} · ${a.dimensions.map(n=>Math.round(n*100)).join(' × ')} cm`;document.querySelectorAll('[data-asset]').forEach(b=>b.classList.toggle('selected',b.dataset.asset===id));}
let down;canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5||!model)return;pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(model,true).filter(h=>{for(let o=h.object;o;o=o.parent)if(!o.visible)return false;return true});if(hits.length){let o=hits[0].object;while(o&&!o.userData.asset_id)o=o.parent;if(o)select(o.userData.asset_id);}});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.setViewOffset(innerWidth,innerHeight,innerWidth>700?140:0,innerWidth>700?0:-90,innerWidth,innerHeight);camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
try{manifest=await(await fetch('./assets.json')).json();const gltf=await new GLTFLoader().loadAsync('./family-home-v1.glb');model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}if(o.userData.asset_id)groups.set(o.userData.asset_id,o);});scene.add(model);for(const a of manifest.assets.filter(a=>a.category!=='공간')){const b=document.createElement('button');b.dataset.asset=a.id;const d=document.createElement('span');d.className='dot';b.append(d,document.createTextNode(a.title));b.addEventListener('click',()=>select(a.id));document.querySelector('#assets').append(b);}status.remove();view('overview');visibility();window.homeReady=true;window.homeAssetCount=groups.size;}catch(e){status.className='error';status.textContent='3D 공간을 불러오지 못했습니다. 새로고침해 주세요.';console.error(e);}
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></body></html>
