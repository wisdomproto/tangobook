<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가구 · MiniMax 실사와 3D 비교</title>
<style>body{margin:0;background:#eeeae3;color:#25382f;font-family:system-ui}header{padding:24px 28px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.6;margin:7px 0}main{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:0 28px 28px;max-width:1800px;margin:auto}figure{margin:0;background:white;border-radius:14px;overflow:hidden;min-width:0}video{display:block;width:100%;aspect-ratio:4/5;background:#151515}#view{aspect-ratio:4/5;position:relative}canvas{display:block}figcaption{padding:16px}button{border:1px solid #bdc7ba;border-radius:7px;padding:9px;background:white;margin:3px}a{color:#236448}#status{position:absolute;top:12px;left:12px;padding:7px;background:#ffffffeb;border-radius:6px;font-size:13px}.links{display:flex;gap:18px;flex-wrap:wrap}#step{font-weight:600}@media(max-width:750px){main{grid-template-columns:1fr}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<header><h1>ㄱ → ㅏ → ㄱ → ㅜ · 가구!</h1><p>오른손으로 블록을 하나씩 놓고, 마지막 ㅜ를 놓은 뒤, 같은 카메라를 돌아보며 웃습니다.<br>기존 게임의 ‘가 · 구 · 가구’ 음원과 정답 효과음, 칭찬 음성을 넣었습니다.</p><p>마지막 블록과 웃는 반응은 컷 전환 없는 한 구간입니다. 앞의 세 근접컷은 이전 시안이며 컷 사이 공간 차이는 남아 있습니다. 3D는 동작 단계에 맞춘 비교입니다.</p><div class="links"><a href="tango-turnaround/native/fixed-camera-turnaround.blend">Blender 애니메이션 원본</a><a href="tango-turnaround/tango-gagu-turnaround.mp4" download>영상 다운로드</a><a href="tango-v8.html">사진·원본 비교</a><a href="tango-minimax-sequence-cuts.html">이전 다섯 컷 시안</a><a href="tango-turnaround/final-tile-smile.mp4">마지막 한 컷만 보기</a></div><nav aria-label="동작 구간"><button data-shot="0">첫 ㄱ</button><button data-shot="1">ㅏ · 가 완성</button><button data-shot="2">두 번째 ㄱ</button><button data-shot="3">ㅜ · 구 완성</button><button data-shot="4">아이 반응</button></nav></header>
<main><figure><video id="film" controls playsinline preload="metadata" poster="tango-minimax-sequence/keyframes/grip-state-0.png" src="tango-turnaround/tango-gagu-turnaround.mp4?range=1"></video><figcaption>MiniMax 실사 영상 · 640×800 · 실제 게임 음원<br><span id="step">빈 인식판에서 시작</span></figcaption></figure><figure><video id="native" muted playsinline preload="metadata" src="tango-turnaround/native-comparison.mp4?range=1"></video><figcaption>Blender 동작 원본 · 단계별 비교</figcaption></figure><figure><div id="view"><span id="status">원본 3D 애니메이션 불러오는 중…</span></div><figcaption>3D 모델 · 촬영 카메라 / 자유 시점<br><button id="pov">촬영 카메라</button><button id="orbit">둘러보기</button><button id="restart">처음부터 재생</button></figcaption></figure></main>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const el=document.getElementById('view'),film=document.getElementById('film'),status=document.getElementById('status');
const manifest=await fetch('tango-turnaround/manifest.json').then(r=>r.json());
const native=document.getElementById('native');
const lastButton=document.createElement('button');lastButton.textContent='끝 모습';lastButton.onclick=()=>{film.pause();film.currentTime=manifest.duration-.05};document.querySelector('nav').appendChild(lastButton);
for(const button of document.querySelectorAll('[data-shot]'))button.onclick=()=>{film.currentTime=manifest.shots[Number(button.dataset.shot)].start;void film.play().catch(()=>{})};
function nativeTime(t){const index=manifest.shots.findLastIndex(s=>s.start<=t);const i=Math.max(0,index),shot=manifest.shots[i],elapsed=Math.max(0,t-shot.start);if(i===4)return 8.3+5.65*Math.min(1,elapsed/shot.duration);if(i===3){const release=manifest.placements[3]-shot.start;if(elapsed<release)return 6.333333+(7.2-6.333333)*elapsed/release;return 7.2+1.1*Math.min(1,(elapsed-release)/(shot.duration-release))}const place=[1.5,3.4,5.3,7.2][i],release=manifest.placements[i]-shot.start;if(elapsed<release)return place-.88+.88*elapsed/release;return place+.3*Math.min(1,(elapsed-release)/.5)}
const scene=new T.Scene();scene.background=new T.Color('#ece7dd');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);renderer.toneMapping=T.ACESFilmicToneMapping;
scene.add(new T.HemisphereLight(0xffffff,0x817669,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);
const cam=new T.PerspectiveCamera(45,.8,.01,100),controls=new OrbitControls(cam,renderer.domElement);controls.enabled=false;controls.enableDamping=true;
let mixer,cameras=[],follow=true;const markers=new T.Group();scene.add(markers);markers.visible=false;
cam.position.set(3.48,1.05,1.94);cam.lookAt(3.89,.6,2.37);
new GLTFLoader().load('tango-turnaround/native/fixed-camera-turnaround.glb',g=>{
 scene.add(g.scene);mixer=new T.AnimationMixer(g.scene);for(const clip of g.animations)mixer.clipAction(clip).play();
 cameras=[g.cameras.find(c=>c.name.includes('Tango')&&c.name.includes('detail')),g.cameras.find(c=>c.name.includes('Tango')&&c.name.includes('over-shoulder'))];

 scene.updateMatrixWorld(true);for(const c of cameras){if(!c)continue;const copy=c.clone();copy.position.copy(c.getWorldPosition(new T.Vector3()));copy.quaternion.copy(c.getWorldQuaternion(new T.Quaternion()));copy.near=.04;copy.far=.4;copy.updateProjectionMatrix();copy.updateMatrixWorld();markers.add(new T.CameraHelper(copy))}
 status.textContent='원본 Blender 모델 · 동작 단계 비교';
},undefined,e=>{status.textContent='3D 로딩 실패';console.error(e)});
document.getElementById('orbit').onclick=()=>{follow=false;controls.enabled=true;markers.visible=true;cam.position.set(4.8,1.9,3.2);controls.target.set(3.9,.6,2.1);cam.fov=45;cam.updateProjectionMatrix();controls.update()};
document.getElementById('pov').onclick=()=>{follow=true;controls.enabled=false;markers.visible=false};
document.getElementById('restart').onclick=()=>{film.currentTime=0;void film.play().catch(()=>{status.textContent='영상의 재생 버튼을 눌러주세요'})};
new ResizeObserver(()=>{renderer.setSize(el.clientWidth,el.clientHeight);cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix()}).observe(el);
renderer.setAnimationLoop(()=>{
 const t=nativeTime(film.currentTime);if(native.readyState>=1&&!native.seeking&&Math.abs(native.currentTime-t)>.08)native.currentTime=t;if(mixer)mixer.setTime(Math.min(t,335/24));
 if(follow&&cameras.length){const source=cameras[t<6.333333?0:1];if(source){source.updateWorldMatrix(true,false);cam.position.copy(source.getWorldPosition(new T.Vector3()));cam.quaternion.copy(source.getWorldQuaternion(new T.Quaternion()));cam.fov=source.fov;cam.updateProjectionMatrix()}}
 if(controls.enabled)controls.update();renderer.render(scene,cam);
 document.getElementById('step').textContent=t<1.5?'ㄱ 블록을 놓는 중':t<3.4?'ㅏ 블록을 놓는 중':t<5.3?'가! · 두 번째 ㄱ':t<7.2?'ㅜ를 ㄱ 아래에 놓기':t<9.35?'구! → 정답 효과음 → 가구':'완성! · 엄마 카메라를 돌아보며 웃기';
});
</script></html>
