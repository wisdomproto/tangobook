<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 6장 · 짧은 블록 영상</title>
<style>body{margin:0;background:#eeeae3;color:#25382f;font-family:system-ui}header{padding:24px 28px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.6;margin:7px 0}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 28px 24px;max-width:1800px;margin:auto}figure{margin:0;background:white;border-radius:14px;overflow:hidden}video,#view,#anchor{display:block;width:100%;aspect-ratio:4/5;object-fit:contain;background:#151515}#view{position:relative}figcaption{padding:14px;line-height:1.5}button{border:1px solid #bdc7ba;border-radius:7px;padding:9px;background:white;margin:3px;cursor:pointer}a{color:#236448}#status{position:absolute;top:12px;left:12px;padding:7px;background:#ffffffe8;border-radius:6px;font-size:13px}.links{display:flex;gap:18px;flex-wrap:wrap}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:0 28px 28px;max-width:1800px;margin:auto}.gallery button{padding:0;overflow:hidden;text-align:left}.gallery img{display:block;width:100%}.gallery span{display:block;padding:10px;font-size:13px}.gallery button[aria-pressed=true]{outline:3px solid #417b55}@media(max-width:800px){main{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr)}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<header><h1>이미지 6장 → 짧은 블록 영상</h1><p>빈 판에서 ㄱ·ㅏ를 놓기까지, 같은 근접 구도의 중간 상태를 촘촘히 지정했습니다.</p><p id="verdict">영상 생성·검수 중입니다. 아래에서 참조 이미지를 먼저 볼 수 있습니다.</p><button id="play">처음부터 재생</button><button id="end">끝 상태 비교</button><button id="cuts">사진 컷 · 4.5초</button><button id="motion" disabled>MiniMax 움직임</button><div class="links"><a href="tango-two-block-close-v2.html">이전 근접 영상</a><a href="tango-dense-guides/photo-cuts.mp4">사진 컷 영상</a><a id="ai-link" hidden href="tango-dense-guides/ai.mp4">MiniMax 영상</a><a href="tango-dense-guides/two-block-native.blend">공간 Blender 원본</a></div></header>
<main><figure><img id="anchor" alt="빈 인식판 참조" src="tango-dense-guides/keyframes/empty.png"><figcaption id="anchor-label">참조 이미지 · 빈 판</figcaption></figure><figure><video id="ai" controls muted playsinline preload="metadata" poster="tango-dense-guides/keyframes/release-a.png" src="tango-dense-guides/photo-cuts.mp4"></video><figcaption id="video-label">사진 컷 미리보기 · 정지 이미지 6장 · 4.5초<br>MiniMax 움직임 연결 버전은 생성 중입니다.</figcaption></figure><figure><div id="view"><span id="status">3D 불러오는 중…</span></div><figcaption>공간·카메라 참고용 3D<br>사진 속 손동작과 일치하는 인물 모델은 아닙니다.<br><button id="pov">촬영 카메라</button><button id="orbit">둘러보기</button></figcaption></figure></main><section class="gallery" id="gallery" aria-label="참조 이미지 여섯 장"></section>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const video=document.getElementById('ai'),anchor=document.getElementById('anchor'),label=document.getElementById('anchor-label'),gallery=document.getElementById('gallery');
const names=['empty','grip-g','hover-g','release-g','hover-a','release-a'],labels=['빈 판','ㄱ 집기','ㄱ 들기','ㄱ 놓기','ㅏ 들기','ㅏ 놓기'],times=[0,22/24,44/24,66/24,88/24,123/24];
let mode='cuts',ready=false;function currentTimes(){return mode==='cuts'?[0,.75,1.5,2.25,3,3.75]:times}function show(i){anchor.src=`tango-dense-guides/keyframes/${names[i]}.png`;anchor.alt=labels[i];label.textContent=`참조 이미지 · ${labels[i]} · ${currentTimes()[i].toFixed(2)}초`;for(const [j,b]of [...gallery.children].entries())b.setAttribute('aria-pressed',String(i===j))}
for(const [i,name]of names.entries()){const b=document.createElement('button');b.innerHTML=`<img src="tango-dense-guides/keyframes/${name}.png" alt="${labels[i]}"><span>${labels[i]} · 가이드 ${times[i].toFixed(2)}초</span>`;b.onclick=()=>{video.pause();if(Number.isFinite(video.duration))video.currentTime=Math.min(currentTimes()[i],video.duration-.001);show(i)};gallery.appendChild(b)}show(0);
video.addEventListener('timeupdate',()=>{let i=0;for(let j=1;j<times.length;j++)if(video.currentTime>=currentTimes()[j]-.05)i=j;show(i)});
document.getElementById('play').onclick=()=>{video.currentTime=0;void video.play()};document.getElementById('end').onclick=()=>{video.pause();if(Number.isFinite(video.duration))video.currentTime=video.duration-.01;show(5)};
function selectMode(next){if(next==='motion'&&!ready)return;mode=next;video.pause();video.src='tango-dense-guides/'+(next==='cuts'?'photo-cuts.mp4':'ai.mp4');document.getElementById('video-label').textContent=next==='cuts'?'사진 컷 · 정지 이미지 6장 · 4.5초':'MiniMax · 첫·끝 + 중간 4장 · 한 영상 · 두 블록 조립';show(0)}document.getElementById('cuts').onclick=()=>selectMode('cuts');document.getElementById('motion').onclick=()=>selectMode('motion');fetch('tango-dense-guides/verdict.json').then(r=>r.json()).then(v=>{document.getElementById('verdict').textContent=v.summary;ready=true;document.getElementById('ai-link').hidden=false;document.getElementById('motion').disabled=false;selectMode('motion')}).catch(()=>{});
const el=document.getElementById('view'),status=document.getElementById('status'),scene=new T.Scene();scene.background=new T.Color('#ece7dd');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;el.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x817669,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);
const cam=new T.PerspectiveCamera(45,.8,.01,100),controls=new OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.enabled=false;let pov,follow=true;
new GLTFLoader().load('tango-dense-guides/native.glb',g=>{scene.add(g.scene);const mixer=new T.AnimationMixer(g.scene);for(const clip of g.animations)mixer.clipAction(clip).play();mixer.setTime(5.12);pov=g.cameras.find(c=>c.name.includes('Tango')&&c.name.includes('over-shoulder'));status.textContent='같은 공간 · 근접 카메라'},undefined,()=>status.textContent='3D 로드 실패');
document.getElementById('pov').onclick=()=>{follow=true;controls.enabled=false;status.textContent='근접 카메라'};document.getElementById('orbit').onclick=()=>{follow=false;controls.enabled=true;controls.target.set(3.9,.65,2.05);status.textContent='드래그로 둘러보기'};
new ResizeObserver(()=>{const w=el.clientWidth,h=w*1.25;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(el);renderer.setAnimationLoop(()=>{if(pov&&follow){pov.updateWorldMatrix(true,false);pov.getWorldPosition(cam.position);pov.getWorldQuaternion(cam.quaternion);cam.fov=pov.fov;cam.updateProjectionMatrix()}if(!follow)controls.update();renderer.render(scene,cam)});
</script></html>
