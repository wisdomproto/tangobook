<style>

olute;top:50%;left:30%;color:#8a947e}.bottom{height:94px;padding:14px 25px;display:flex;align-items:center;gap:12px;overflow:auto;background:#f8f7f2}.shot{min-width:190px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#efeee7;border:1px solid transparent;border-radius:8px;text-align:left;color:#6f7964}.shot.active{border-color:#a2ad92;background:#e8eddf}.shot img{height:45px;width:36px;object-fit:cover;border-radius:3px}.shot span{display:block;font-size:12px}.shot small{font-size:10px;color:#929a87}.review{position:absolute;bottom:55px;right:27px;max-width:300px;background:#fffffff0;color:#514d3c;padding:9px 12px;border-radius:8px;font-size:11px;line-height:1.65;z-index:3;pointer-events:none}.download{color:#788367;text-decoration:none;font-size:11px}.mini{font-size:10px;color:#949b87}#missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f1f0e9;color:#87927b;text-align:center;padding:30px;z-index:1}#missing[hidden]{display:none}.view-hint{position:absolute;right:20px;top:55px;font-size:10px;color:#8a947e}button:focus-visible,a:focus-visible{outline:2px solid #be9657;outline-offset:3px}@media(max-width:760px){header{height:85px;padding:15px}h1{font-size:20px}header p{display:none}.layout{height:auto;grid-template-columns:1fr;background:none}.panel{height:570px}.panel.right{height:450px}.bottom{height:auto;flex-wrap:wrap}.shot{min-width:calc(50% - 12px);flex:1}.photo-stage{inset:50px 15px}.review{bottom:50px;font-size:9px;max-width:180px}}

<body><header><div><div class="eyebrow">HOME 05 · PBR FEED</div><h1>PBR 원본으로 만든 육아 피드</h1></div><div><p>이미지와 카메라 위치를 함께 비교하세요 · <a class="download" href="layout-v3.html">새 집 구조 →</a> · <a class="download" href="materials-v5.html">PBR 원본 →</a></p><a class="download" href="family-home-feed-v5.blend" download>촬영 카메라 포함 Blender 원본 ↓</a></div></header>
<main class="layout"><section class="panel left"><div class="head"><strong id="shot-title">이미지</strong><span id="image-mode">AI PHOTO</span></div><div class="photo-stage"><div class="photo-frame"><img id="guide" alt="같은 카메라의 원본 3D 렌더"><img id="photo" alt="3D 렌더를 참조한 생성 이미지"><div id="missing" hidden>이미지 생성 중입니다.<br>원본 3D 렌더는 아래 슬라이더로 볼 수 있습니다.</div></div></div><div class="review" id="review"></div><div class="left-tools"><span>원본 3D</span><input id="blend" type="range" min="0" max="100" value="100" aria-label="원본 3D와 생성 이미지 비교"><span>생성 이미지</span><a id="image-link" class="download" download>원본 ↓</a></div></section>
<section class="panel right"><div class="head"><strong>촬영 위치와 시야</strong><span class="chip">주황색 = 촬영 카메라</span></div><div class="camera-info" id="camera-info"></div><div class="view-hint" id="view-hint">드래그 회전 · 휠 확대</div><canvas id="scene"></canvas><div id="render-status">3D 집을 불러오는 중…</div><div class="right-tools"><button id="orbit" class="active">카메라 위치</button><button id="top">위에서 보기</button><button id="pov">촬영 시점</button></div></section></main><nav class="bottom" id="shots" aria-label="촬영 장면"></nav>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.querySelector('#scene'),panel=canvas.parentElement,renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
const scene=new THREE.Scene();scene.background=new THREE.Color('#eeece5');const camera=new THREE.PerspectiveCamera(42,1,.03,100);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=.6;controls.maxDistance=30;controls.maxPolarAngle=Math.PI*.49;
scene.add(new THREE.HemisphereLight(0xfff8e9,0x9da690,1.5));const sun=new THREE.DirectionalLight(0xfff5de,2.6);sun.position.set(-6,10,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:.1,far:30});sun.shadow.bias=-.0004;sun.shadow.normalBias=.025;scene.add(sun);const fill=new THREE.DirectionalLight(0xffffff,.8);fill.position.set(4,7,8);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#eeece5',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.24;ground.receiveShadow=true;scene.add(ground);
const markers=new THREE.Group();scene.add(markers);const architectures=new Map(),wallMeshes=[];const cut=new THREE.Plane(new THREE.Vector3(0,-1,0),.85);renderer.localClippingEnabled=true;let shots,current,mode='orbit',model;
const orange=0xc56820;function lines(points,color=orange){return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p))),new THREE.LineBasicMaterial({color,transparent:true,opacity:1,depthTest:false}));}
function clearMarkers(){while(markers.children.length){const o=markers.children[0];markers.remove(o);o.traverse(p=>{p.geometry?.dispose();if(Array.isArray(p.material))p.material.forEach(m=>m.dispose());else p.material?.dispose();});}}
function markShot(){clearMarkers();if(!current)return;const p=current.position,c=current.frustum_corners,edges=[];for(let i=0;i<4;i++){edges.push(p,c[i],c[i],c[(i+1)%4]);}markers.add(lines(edges));const vertices=[];for(let i=0;i<4;i++)vertices.push(...p,...c[i],...c[(i+1)%4]);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));const cone=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:orange,transparent:true,opacity:.045,side:THREE.DoubleSide,depthWrite:false}));markers.add(cone);const dot=new THREE.Mesh(new THREE.SphereGeometry(.085,20,12),new THREE.MeshBasicMaterial({color:orange}));dot.position.fromArray(p);markers.add(dot);const body=new THREE.Mesh(new THREE.BoxGeometry(.22,.14,.13),new THREE.MeshStandardMaterial({color:orange,roughness:.4}));body.position.fromArray(p);body.lookAt(new THREE.Vector3(...current.target));markers.add(body);markers.add(lines([p,[p[0],.04,p[2]]],0xae936c));const ring=new THREE.Mesh(new THREE.RingGeometry(.13,.17,32),new THREE.MeshBasicMaterial({color:orange,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(p[0],.052,p[2]);markers.add(ring);}
function resize(){const w=panel.clientWidth,h=panel.clientHeight;renderer.setSize(w,h,false);camera.clearViewOffset();if(mode==='pov'&&current){camera.aspect=current.aspect;const aw=Math.min(w,h*current.aspect),ah=aw/current.aspect;renderer.setViewport((w-aw)/2,(h-ah)/2,aw,ah);}else{camera.aspect=w/h;renderer.setViewport(0,0,w,h);}camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(panel);
function setMode(next){mode=next;controls.enabled=next!=='pov';controls.enableDamping=next!=='pov';markers.visible=next!=='pov';architectures.forEach(o=>o.visible=next==='pov');for(const o of wallMeshes){o.material.clippingPlanes=next==='pov'?[]:[cut];o.material.clipShadows=true;}
camera.up.set(0,1,0);if(next==='pov'){camera.fov=current.fov_vertical;camera.position.fromArray(current.position);controls.target.fromArray(current.target);camera.lookAt(controls.target);}else{camera.fov=42;camera.position.set(...(next==='top'?[-.85,21,.36]:[13,15,18]));controls.target.set(-.85,.4,.35);controls.update();}document.querySelectorAll('.right-tools button').forEach(b=>b.classList.toggle('active',b.id===next));document.querySelector('#view-hint').textContent=next==='pov'?'원본 렌더와 같은 위치·화각':'드래그 회전 · 휠 확대';resize();}
for(const id of ['orbit','top','pov'])document.querySelector('#'+id).addEventListener('click',()=>setMode(id));
const guide=document.querySelector('#guide'),photo=document.querySelector('#photo'),blend=document.querySelector('#blend'),missing=document.querySelector('#missing');let photoLoaded=false;
const version=document.createElement('select');version.id='version';version.setAttribute('aria-label','생성 버전 선택');version.style.cssText='max-width:165px;font-size:11px;color:#6c765d;background:#fff;border:1px solid #d7dbcd;border-radius:5px;padding:4px';document.querySelector('.left-tools').prepend(version);
function applyVariant(){const v=current.variants?.[Number(version.value)];photoLoaded=false;photo.src=v?.image||current.image;document.querySelector('#image-link').href=v?.image||current.image;document.querySelector('#review').textContent=v?.review||current.review;blendImages();}version.addEventListener('change',applyVariant);
function blendImages(){photo.style.opacity=blend.value/100;document.querySelector('#image-mode').textContent=blend.value==='0'?'3D GUIDE':blend.value==='100'?(current?.variants?.[Number(version.value)]?.kind==='render'?'CYCLES RENDER':'AI PHOTO'):'OVERLAY '+blend.value+'%';missing.hidden=photoLoaded||blend.value==='0';}
blend.addEventListener('input',blendImages);photo.addEventListener('load',()=>{photoLoaded=true;blendImages();});photo.addEventListener('error',()=>{photoLoaded=false;photo.style.opacity=0;missing.hidden=blend.value==='0';});
function selectShot(s){current=s;guide.src=s.guide;document.querySelector('#shot-title').textContent=s.title;document.querySelector('#camera-info').textContent=`CAM ${String(s.number).padStart(2,'0')} · ${s.lens_mm} mm · 높이 ${s.position[1].toFixed(2)} m`;version.replaceChildren();for(const [i,v] of (s.variants||[{title:'실사화'}]).entries()){const option=document.createElement('option');option.value=i;option.textContent=v.title;version.append(option);}version.hidden=!s.variants;applyVariant();document.querySelectorAll('[data-shot]').forEach(b=>b.classList.toggle('active',b.dataset.shot===s.id));markShot();setMode(mode);window.currentHomeShot=s.id;}
try{shots=await(await fetch('./feed-v5-shots.json')).json();const gltf=await new GLTFLoader().loadAsync('./family-home-materials-v5.glb');model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;let p=o;while(p&&!p.userData.asset_id)p=p.parent;if(p?.userData.wall){o.material=o.material.clone();wallMeshes.push(o);}if(o.material.name==='Soft blue window'){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.16;o.material.depthWrite=false;}if(o.userData.asset_id==="architecture-ceiling"){o.castShadow=false;o.receiveShadow=false;o.material=new THREE.MeshBasicMaterial({color:0xe9e5da,side:THREE.DoubleSide});}}if(o.userData.asset_id==='architecture-ceiling')architectures.set(o.userData.asset_id,o);});scene.add(model);for(const s of shots){const b=document.createElement('button');b.className='shot';b.dataset.shot=s.id;const img=document.createElement('img');img.src=s.image;img.alt='';img.addEventListener('error',()=>{img.src=s.guide;},{once:true});const label=document.createElement('div'),title=document.createElement('span'),sub=document.createElement('small');title.textContent=s.title;sub.textContent=`CAM ${s.number} / ${s.lens_mm} mm`;label.append(title,sub);b.append(img,label);b.addEventListener('click',()=>selectShot(s));document.querySelector('#shots').append(b);}document.querySelector('#render-status').remove();selectShot(shots[0]);window.comparisonReady=true;}catch(e){document.querySelector('#render-status').textContent='3D 집을 불러오지 못했습니다.';console.error(e);}
renderer.setAnimationLoop(()=>{if(controls.enabled)controls.update();renderer.render(scene,camera);});
</script></body></html>
