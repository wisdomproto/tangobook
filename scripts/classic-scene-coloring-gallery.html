<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동화 · 장면 색칠 모음</title>
<style>
:root{font-family:'Malgun Gothic',sans-serif;color:#292c28;background:#faf8f1}*{box-sizing:border-box}body{margin:0}header{padding:36px max(24px,calc((100vw - 1450px)/2));background:#e2ece3;border-bottom:1px solid #b9cdbb}h1{font-size:32px;margin:8px 0 12px}p{line-height:1.7}header p{margin:0;color:#516354}.kicker{letter-spacing:3px;font-size:12px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:12px;flex-wrap:wrap;background:#faf8f1ee;padding:16px 24px;border-bottom:1px solid #ddd}input,select,button{font:inherit;border:1px solid #c9cec4;border-radius:10px;padding:11px 14px;background:white;color:inherit}input{flex:1;min-width:180px}button{cursor:pointer}button[aria-selected=true]{background:#304c39;color:white;border-color:#304c39}button:hover{background:#eef4ee}button:disabled{opacity:.5;cursor:default}main{max-width:1500px;margin:24px auto;padding:0 24px}.book{margin:0 0 36px}.book h2{font-size:21px;margin:0 0 14px}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.scene{background:white;border:1px solid #dedfd7;border-radius:18px;overflow:hidden}.scene-head{padding:13px 18px;display:flex;justify-content:space-between;gap:10px;font-weight:bold}.status{font-size:12px;color:#64736a}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ddd}.picture{background:white;position:relative;min-height:160px;display:grid;place-items:center}.picture img{width:100%;height:100%;aspect-ratio:16/9;object-fit:contain}.picture span{position:absolute;top:8px;left:8px;font-size:11px;padding:4px 7px;border-radius:5px;background:#ffffffe0}.pending{color:#999;font-size:14px}.body{padding:16px 18px}.body p{font-size:13px;white-space:pre-line;margin:0 0 14px;min-height:66px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.actions a{font-size:12px;padding:9px 12px}.actions a{border:1px solid #ddd;border-radius:9px;text-decoration:none;color:inherit}#count{padding:0 24px;font-size:13px;color:#637063}dialog{border:none;border-radius:20px;padding:0;max-width:1000px;width:calc(100% - 32px);background:#18241d;color:white}dialog::backdrop{background:#000b}dialog img{display:block;width:100%;max-height:65vh;object-fit:contain;background:#111}dialog .caption{padding:18px 24px;font-size:18px;line-height:1.8;white-space:pre-line}dialog .top{padding:12px 20px;display:flex;align-items:center;justify-content:space-between}#play-state{font-size:12px;color:#d7e5d5}#empty{padding:50px;text-align:center;display:none} @media(max-width:900px){.scenes{grid-template-columns:1fr}header{padding:25px}h1{font-size:25px}}@media print{header,.toolbar,.actions,#count,dialog{display:none}.scene{break-inside:avoid}.scenes{display:block}.scene{margin-bottom:20px}}
</style></head><body>
<header><div class="kicker">TANGOBOOK / STORY COLORING</div><h1>동화 장면 색칠 모음</h1><p>그림체마다 다른 책, 책마다 두 장면. 원본 삽화와 색칠 도안을 함께 살펴보세요.</p><div role="tablist" aria-label="동화 분류" style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button id="classic-tab" role="tab" aria-selected="true">명작동화</button><button id="traditional-tab" role="tab" aria-selected="false">전래동화</button><button id="hori-life-tab" role="tab" aria-selected="false">호리 생활동화</button><button id="hori-kindergarten-tab" role="tab" aria-selected="false">호리 유치원</button><button id="hori-vehicles-tab" role="tab" aria-selected="false">호리 탈것</button><button id="nature-tab" role="tab" aria-selected="false">자연관찰</button><button id="changjak-pongi-tab" role="tab" aria-selected="false">창작동화 1 · 퐁이네</button><button id="changjak-coco-tab" role="tab" aria-selected="false">창작동화 2 · 코코네 빵집 골목</button><button id="changjak-mei-tab" role="tab" aria-selected="false">창작동화 3 · 메이네 산마을</button><button id="changjak-dodo-tab" role="tab" aria-selected="false">창작동화 4 · 도도네 물방앗간</button><button id="changjak-bruno-tab" role="tab" aria-selected="false">창작동화 5 · 브루노 할아버지네 숲</button><button id="changjak-twins-tab" role="tab" aria-selected="false">창작동화 6 · 쌍둥이네 바닷가</button><button id="changjak-mio-tab" role="tab" aria-selected="false">창작동화 7 · 미오네 유치원</button><button id="changjak-pipo-tab" role="tab" aria-selected="false">창작동화 8 · 피포네 돌담 목장</button><button id="changjak-nono-tab" role="tab" aria-selected="false">창작동화 9 · 노노네 겨울 골목</button><button id="changjak-lulu-tab" role="tab" aria-selected="false">창작동화 10 · 룰루네 올리브 언덕</button></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="동화 제목 검색" aria-label="동화 제목 검색"><select id="style" aria-label="그림체"><option value="">모든 그림체</option><option value="1">그림체 1</option><option value="2">그림체 2</option><option value="3">그림체 3</option></select><select id="status" aria-label="제작 상태"><option value="">전체</option><option value="generated">도안 생성됨</option><option value="pending">제작 중</option></select><select id="lang" aria-label="읽기 언어"><option value="ko">한국어 읽기</option><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="zh">中文</option><option value="th">ภาษาไทย</option></select><button id="refresh">새로고침</button></div>
<p id="count"></p><main id="books"></main><div id="empty">검색 결과가 없습니다.</div>
<dialog id="reveal"><div class="top"><strong id="reveal-title"></strong><button id="close">닫기</button></div><img id="reveal-image" alt="원본 동화 장면"><div id="caption" class="caption"></div><div class="top"><span id="play-state"></span><button id="replay">다시 읽기</button></div></dialog>
<script id="manifest" type="application/json">__MANIFEST__</script><script>
let data=JSON.parse(document.querySelector('#manifest').textContent);const collections=["classic","traditional","hori-life","hori-kindergarten","hori-vehicles","nature","changjak-pongi","changjak-coco","changjak-mei","changjak-dodo","changjak-bruno","changjak-twins","changjak-mio","changjak-pipo","changjak-nono","changjak-lulu"];let collection=data[0]?.collection||'classic';let active=null;let voice=null;let music=null;let audioRun=0;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const query=$('search').value.trim().toLowerCase(),style=$('style').value,status=$('status').value;const selected=data.filter(j=>(j.collection||'classic')===collection);for(const name of collections){$(name+'-tab').setAttribute('aria-selected',String(collection===name));$(name+'-tab').tabIndex=collection===name?0:-1;}const visible=selected.filter(j=>j.title.toLowerCase().includes(query)&&(!style||j.title.endsWith('그림체'+style))&&(!status||(status==='pending'?j.status!=='generated':j.status===status)));const grouped=new Map();for(const j of visible){if(!grouped.has(j.bookId))grouped.set(j.bookId,[]);grouped.get(j.bookId).push(j)}$('count').textContent=selected.length?`${new Set(selected.map(j=>j.bookId)).size}권 · ${selected.filter(j=>j.status==='generated').length} / ${selected.length}장 생성 · 현재 ${grouped.size}권 표시`:'대표 장면을 선정하고 있습니다.';$('books').innerHTML=Array.from(grouped.values()).map(jobs=>`<section class="book"><h2>${esc(jobs[0].title.replace('_그림체',' · 그림체 '))}</h2><div class="scenes">${jobs.map(j=>`<article class="scene"><div class="scene-head"><span>${j.pageNumber}쪽</span><span class="status">${j.status==='generated'?(j.colorCheck?.monochromePassed?'흑백 검사 통과 · 검수 중':'도안 생성됨 · 검수 중'):(j.status.startsWith('color-')?'색 제거 재생성 중':j.status==='needs-monochrome-review'?'재검수 필요':'제작 중')}</span></div><div class="pair"><div class="picture"><img loading="lazy" src="${esc(j.sourceFile)}" alt="${esc(j.title)} ${j.pageNumber}쪽 원본"><span>원본 삽화</span></div><div class="picture">${j.status==='generated'?`<img loading="lazy" src="${esc(j.lineartFile+'?v='+(j.lineartSha256||'').slice(0,12))}" alt="${esc(j.title)} ${j.pageNumber}쪽 색칠 도안">`:'<div class="pending">색칠 도안을 준비하고 있어요</div>'}<span>색칠 도안</span></div></div><div class="body"><p>${esc(j.text)}</p><div class="actions"><button data-read="${esc(j.key)}">♫ 원본 장면 읽어주기</button>${j.status==='generated'?`<a href="http://127.0.0.1:5191/play?key=${encodeURIComponent(j.key)}" target="_blank">색칠해 보기</a><a href="${esc(j.lineartFile+'?v='+(j.lineartSha256||'').slice(0,12))}" target="_blank">도안 크게 보기</a><a href="${esc(j.lineartFile+'?v='+(j.lineartSha256||'').slice(0,12))}" download>PNG 저장</a>`:''}</div></div></article>`).join('')}</div></section>`).join('');$('empty').style.display=visible.length?'none':'block';$('empty').textContent=selected.length?'검색 결과가 없습니다.':'이 분류의 색칠 콘텐츠를 준비하고 있습니다.';}
function stop(){audioRun++;if(voice){voice.pause();voice.removeAttribute('src');voice.load();voice=null}if(music){music.pause();music.removeAttribute('src');music.load();music=null}}
async function read(j){stop();active=j;const run=audioRun;const lang=$('lang').value;const translated=lang==='ko'?{text:j.text,ttsUrl:j.ttsUrl}:j.translations?.[lang];$('reveal-title').textContent=j.title.replace('_그림체',' · 그림체 ')+' / '+j.pageNumber+'쪽';$('reveal-image').src=j.sourceFile;$('caption').textContent=translated?.text||'이 언어의 본문이 없습니다.';if(!$('reveal').open)$('reveal').showModal();if(!translated?.ttsUrl){$('play-state').textContent='이 장면의 해당 언어 음원이 없습니다.';return}music=new Audio(j.backgroundMusicUrl);music.loop=true;music.volume=.16;voice=new Audio(translated.ttsUrl);$('play-state').textContent='배경음악과 함께 읽고 있어요';voice.onended=()=>{if(run!==audioRun)return;music?.pause();$('play-state').textContent='읽기가 끝났어요'};voice.onerror=()=>{if(run!==audioRun)return;music?.pause();$('play-state').textContent='음원을 불러오지 못했어요. 다시 읽기를 눌러 주세요.'};const plays=await Promise.allSettled([music.play(),voice.play()]);if(run===audioRun&&plays[1].status==='rejected'){music?.pause();$('play-state').textContent='재생하려면 다시 읽기를 눌러 주세요.'}}
for(const name of collections)$(name+'-tab').onclick=()=>{collection=name;$('search').value='';$('style').value='';$('style').disabled=name!=='classic';stop();render()};for(const name of collections)$(name+'-tab').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=collections.indexOf(name);const next=e.key==='Home'?0:e.key==='End'?collections.length-1:(i+(e.key==='ArrowRight'?1:-1)+collections.length)%collections.length;$(collections[next]+'-tab').click();$(collections[next]+'-tab').focus();};$('books').onclick=e=>{const btn=e.target.closest('[data-read]');if(btn)read(data.find(j=>j.key===btn.dataset.read))};$('close').onclick=()=>$('reveal').close();$('reveal').onclose=stop;$('replay').onclick=()=>active&&read(active);for(const id of ['search','style','status'])$(id).addEventListener('input',render);$('lang').onchange=()=>{if(active&&$('reveal').open)read(active)};$('refresh').onclick=()=>location.reload();window.addEventListener('pagehide',stop);render();
// HTTP preview updates as the batch finishes pages; the standalone file uses Refresh.
if(location.protocol==='http:'||location.protocol==='https:')setInterval(async()=>{if(document.hidden||$('reveal').open)return;try{const response=await fetch('gallery-manifest.json',{cache:'no-store'});if(!response.ok)return;const next=await response.json();const signature=rows=>rows.map(j=>j.key+':'+j.status+':'+(j.lineartSha256||'')).join('|');if(signature(next)!==signature(data)){data=next;render()}}catch{}},10000);
</script></body></html>
